# The blue figure climbs a stair flight attached along a terrain level's
# retaining wall (issue #155) and turns onto the level over the wall top.
# This also pins terrain-following pavement and the shadow-map FOV receivers.
name: city_terrain_ramp_move
map:
  generate:
    type: urban
    seed: 7
    elevated: false
    features: {terrain: on}
    terrain_levels: -1
units:
  - {id: 0, team: blue, position: [-35.71, 0, -45.24], facing_degrees: 100}
  - {id: 1, team: red, position: [-65, 0, 10], facing_degrees: 0}
camera:
  target: [-37, -41]
  zoom: -120
render: {fov_overlay: shadow_map}
script:
  - assert: {unit: 0, position: [-35.71, 0.098, -45.24], tolerance: 0.05}
  - action: move
    actor: 0
    destination: [-38.77, 4.681, -37.40]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-38.77, 4.681, -37.40], tolerance: 0.05}
  - assert: {round: 2}
