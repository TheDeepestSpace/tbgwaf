name: free_aim_friendly_fire
description: >
  Issue #129 friendly fire (default on): the ballistic trace is honest about what stands
  in the bullet's path -- a teammate between the shooter and its aim point absorbs the
  shot first, and the enemy behind survives.

shot_rolls: [0.0]

units:
  - {id: 0, team: blue, position: [0, 0, 0], facing_degrees: 0}
  - {id: 1, team: blue, position: [5, 0, 0], facing_degrees: 0}
  - {id: 2, team: red, position: [10, 0, 0], facing_degrees: 180}

script:
  - action: shoot
    description: Blue0 fires at a chest-height point at red2's position; blue1 stands square in the lane.
    actor: 0
    at: [10, 0.9, 0]
  - action: pass
    actor: 1
  - action: pass
    actor: 2
  - action: commit

  - assert: {unit: 1, alive: false, comment: The teammate caught the bullet first}
  - assert: {unit: 2, alive: true}
  - assert: {winner: none}
  - assert: {round: 2}
