name: playbook_sighting_memory_fades_out
description: >
  Ghosts show for the turn only: red is seen by blue once, then runs out of blue's FOV. When
  the turn ends the ghosts are fully visible, then fade out over kGhostFadeDuration (0.5s) each,
  starting in the order they appeared. Nothing carries over into the next turn.

map:
  obstacles: []

units:
  - {id: 0, team: blue, position: [-14, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [-4, 0, -2], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: true}

  - action: pass
    description: Red leaves blue's FOV during the turn.
    actor: 0
  - action: move
    actor: 1
    destination: [-12, 0, 14]
  - action: commit
  - assert: {unit: 1, visible_to: blue, visible: false}
  - assert: {round: 2}
  - assert: {unit: 1, remembered_by: blue, remembered: true, ghost_alpha: 1.0, comment: Turn just ended; fully visible}

  - action: wait
    seconds: 0.25
  - assert: {unit: 1, remembered_by: blue, ghost_alpha: 0.65, tolerance: 0.2, comment: Oldest ghost is mid-fade}

  - action: wait
    seconds: 10
  - assert: {unit: 1, remembered_by: blue, ghost_alpha: 0.0, comment: Everything has faded}

  - action: pass
    description: Next turn; the faded ghosts are not shown again.
    actor: 0
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 1, visible_to: blue, visible: false}
  - assert: {round: 3}
