# Issue #130: seed-driven overpass layouts. Nothing is forced: seed 22's
# default draw naturally yields the enter-ramp-down layout (the artery enters off-map already elevated and ramps down to grade on-map).
# Blue climbs the branch's connecting ramp; the asserted Y proves the
# ramp-off works, and the goldens show the deck cut off flush at the near map edge.
name: overpass_enter_ramp_down

map:
  generate: {type: urban, seed: 22, arteries: 2}

units:
  - {id: 0, team: blue, position: [-48.3187, 0.6269, -41.2495], facing_degrees: 0}
  - {id: 1, team: red, position: [-64.7858, 0.025, -64.9037], facing_degrees: 180}

camera:
  target: [-45.8, -37.7]
  zoom: 34

script:
  - action: move
    actor: 0
    destination: [-43.3786, 2.1554, -34.1533]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-43.3786, 2.1554, -34.1533], tolerance: 0.05}
  - assert: {round: 2}
