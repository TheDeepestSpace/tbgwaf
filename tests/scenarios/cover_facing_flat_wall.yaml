name: cover_facing_flat_wall
description: >
  Issue #290 follow-up: reaching flat cover (a tall wall face) turns the figure's back to
  the wall in the lean-back pose. The requested final facing (+X, along the wall) is
  ignored: the ghost is locked to back-to-wall (-Z here).

map:
  obstacles:
    - {center: [0, 5], half_extent: [6.0, 0.5], height: 3.0, climbable: false}

units:
  - {id: 0, team: blue, position: [0, 0, -1], facing_degrees: 0}
  - {id: 1, team: red, position: [0, 0, -14], facing_degrees: 180}

camera:
  target: [0, 3]
  zoom: 4

script:
  - action: move
    actor: 0
    destination: [0, 0, 4]
    final_facing_degrees: 0
    comment: Wall is toward +Z; asked to face +X but ends with its back to the wall
  - action: move
    actor: 1
    destination: [0, 0, -12]
  - action: commit
  - assert: {unit: 0, position: [0, 0, 4], tolerance: 0.05}
  - assert: {unit: 0, facing_degrees: -90, tolerance: 0.5}
  - assert: {unit: 0, cover_pose: stand}
