name: cover_facing_corner
description: >
  Reaching tactical cover (a building corner) also turns the figure's back to the
  blocker, here diagonally: the building is toward -X/+Z (135 degrees), so the figure ends facing
  -45 degrees (away from it).

map:
  obstacles:
    - {center: [0, 5], half_extent: [2.0, 2.0], height: 4.0, climbable: false}

units:
  - {id: 0, team: blue, position: [0, 0, -1], facing_degrees: 0}
  - {id: 1, team: red, position: [0, 0, -14], facing_degrees: 180}

camera:
  target: [0, 3]
  zoom: 4

script:
  - action: move
    actor: 0
    destination: [2.4, 0, 2.6]
    final_facing_degrees: 0
    comment: Corner tile; back to the building, not the requested +X
  - action: move
    actor: 1
    destination: [0, 0, -12]
  - action: commit
  - assert: {unit: 0, position: [2.4, 0, 2.6], tolerance: 0.05}
  - assert: {unit: 0, facing_degrees: -45, tolerance: 0.5}
