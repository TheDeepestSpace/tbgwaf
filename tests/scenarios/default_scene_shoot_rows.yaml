# Replicates BuildDefaultScene() (src/game/Scene.cpp) and the same shot
# outcomes as TestGameLogicShootRowsMatchLayout in tests/logic_tests.cpp:
# the top/bottom lanes are wall-blocked (shots there must miss), the middle
# lane is open (a clean shot must hit), and every planned shot on a team's
# turn resolves together once that team commits.
name: default_scene_shoot_rows

map:
  obstacles:
    - {center: [0, -4], half_extent: [1.0, 2.0], height: 2.0, climbable: false}
    - {center: [0, 4], half_extent: [1.0, 2.0], height: 2.0, climbable: false}
    - {center: [-4, 6.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [4, -6.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [-3.5, -7.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [3.5, 7.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}

units:
  - {id: 0, team: blue, position: [-8, 0, -4], facing_degrees: 0}
  - {id: 1, team: blue, position: [-8, 0, 0], facing_degrees: 0}
  - {id: 2, team: blue, position: [-8, 0, 4], facing_degrees: 0}
  - {id: 3, team: red, position: [8, 0, -4], facing_degrees: 180}
  - {id: 4, team: red, position: [8, 0, 0], facing_degrees: 180}
  - {id: 5, team: red, position: [8, 0, 4], facing_degrees: 180}

script:
  # Blue plans all three figures, then commits: rows z=-4 and z=4 are behind
  # walls (blue0 -> red3, blue2 -> red5 must miss), row z=0 is the open
  # middle lane (blue1 -> red4 must hit). Every planned shot is judged
  # against the same pre-commit snapshot, then resolves together.
  - action: shoot
    actor: 0
    target: 3
  - action: shoot
    actor: 1
    target: 4
  - action: shoot
    actor: 2
    target: 5
  - action: commit

  - assert: {unit: 3, alive: true}
  - assert: {unit: 4, alive: false}
  - assert: {unit: 5, alive: true}
  - assert: {winner: none}  # Red still has id3, id5 alive.
  - assert: {current_team: red}

  # Symmetric: Red's two survivors shoot back across the same blocked rows
  # and also miss.
  - action: shoot
    actor: 3
    target: 0
  - action: shoot
    actor: 5
    target: 2
  - action: commit

  - assert: {unit: 0, alive: true}
  - assert: {unit: 2, alive: true}
  - assert: {current_team: blue}
  - assert: {round: 2}
