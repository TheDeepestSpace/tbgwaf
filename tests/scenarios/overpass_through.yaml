# Issue #130: seed-driven overpass layouts. Pins the `through` layout for
# seed 7: the deck enters and exits off-map at full height (no artery
# ramps), so the branch's connecting ramp is the only way between grade and
# the deck. Blue climbs it mid-span; the asserted Y proves the ramp-off
# works, and the goldens show the deck crossing the whole map and running
# past both edges with no stub.
name: overpass_through

map:
  generate: {type: urban, seed: 7, arteries: 2, elevated: true, elevated_layout: through}

units:
  - {id: 0, team: blue, position: [-32.2965, 0.5268, -12.9465], facing_degrees: 21}
  - {id: 1, team: red, position: [65.8291, 0, -19.4045], facing_degrees: 180}

camera:
  target: [-25.8, -10.5]
  zoom: 34

script:
  - action: move
    actor: 0
    destination: [-19.3479, 2.211, -8.09341]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-19.3479, 2.211, -8.09341], tolerance: 0.05}
  - assert: {round: 2}
