name: bomb_debris_knocks_out_figure
description: >
  Destruction I (issue #350): a blast's chunks are lethal. Red0 stands just outside the north
  face of a building. A bomb armed at the face brings the wall down and the chunks thrown out of
  it fly onto red0, knocking it out. Blue0 is far from the blast, so the only thing that can
  knock red0 out is the debris.

camera:
  target: [0, 0]
  zoom: 24

map:
  half_extent: 12
  obstacles:
    - {center: [0, -1.5], half_extent: [2.5, 2.5], height: 6}

units:
  - {id: 0, team: blue, position: [-10, 0, -9], facing_degrees: 0}
  - {id: 1, team: red, position: [0, 0, 2], facing_degrees: 180}

script:
  - assert: {unit: 1, alive: true}
  - action: pass
    actor: 0
  - action: pass
    actor: 1
  - action: bomb
    position: [0, 3, 1]
    radius: 3.5
    at: 1.0
    comment: Armed to go off 1s into round 1, bringing the building's north face down onto red0.
  - action: commit
  - assert: {unit: 1, alive: false}
  - assert: {unit: 0, alive: true}
