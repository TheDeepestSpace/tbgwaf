name: default_scene_shoot_rows
description: >
  Replicates the original open-lane layout (not the current BuildDefaultScene()) and the
  same shot outcomes as TestGameLogicShootRowsMatchLayout in tests/logic_tests.cpp: the
  top/bottom lanes are wall-blocked (shots there must miss), the middle lane is open (a
  clean shot must hit). Under WEGO rounds both teams plan the same round, so the middle
  lane's mutual blue1 <-> red4 exchange resolves simultaneously and downs both shooters.

map:
  obstacles:
    - {center: [0, -4], half_extent: [1.0, 2.0], height: 2.0, climbable: false}
    - {center: [0, 4], half_extent: [1.0, 2.0], height: 2.0, climbable: false}
    - {center: [-4, 6.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [4, -6.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [-3.5, -7.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}
    - {center: [3.5, 7.5], half_extent: [0.6, 0.6], height: 1.2, climbable: true}

units:
  - {id: 0, team: blue, position: [-8, 0, -4], facing_degrees: 0}
  - {id: 1, team: blue, position: [-8, 0, 0], facing_degrees: 0}
  - {id: 2, team: blue, position: [-8, 0, 4], facing_degrees: 0}
  - {id: 3, team: red, position: [8, 0, -4], facing_degrees: 180}
  - {id: 4, team: red, position: [8, 0, 0], facing_degrees: 180}
  - {id: 5, team: red, position: [8, 0, 4], facing_degrees: 180}

script:
  - action: shoot
    description: "Both teams plan the same round: every figure shoots its opposite number, then a single commit resolves everything at once. Rows z=-4 and z=4 are behind walls (those four shots must all miss); row z=0 is the open middle lane, so blue1 and red4 shoot each other in the same instant -- judged against the same snapshot, both shots land and both figures drop."
    actor: 0
    target: 3
  - action: shoot
    actor: 1
    target: 4
  - action: shoot
    actor: 2
    target: 5
  - action: shoot
    actor: 3
    target: 0
  - action: shoot
    actor: 4
    target: 1
  - action: shoot
    actor: 5
    target: 2
  - action: commit

  - assert: {unit: 0, alive: true}
  - assert: {unit: 1, alive: false, comment: Mutual middle-lane exchange}
  - assert: {unit: 2, alive: true}
  - assert: {unit: 3, alive: true}
  - assert: {unit: 4, alive: false, comment: Mutual middle-lane exchange}
  - assert: {unit: 5, alive: true}
  - assert: {winner: none, comment: Both teams still have two survivors}
  - assert: {round: 2}
