name: Deploy PR preview to GitHub Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Build PR-specific images (tag pr-<number>) so Dockerfile changes are
  # picked up without waiting for a merge to master. The dev stage builds on
  # the ci stage, so build ci first to warm the cache.
  ci_image:
    # Forked PRs don't get a token with write access, so previews are
    # limited to same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/thedeepestspace/tbgwaf-ci
      dockerfile: ./Dockerfile
      target: ci
    secrets: inherit

  dev_image:
    needs: ci_image
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/thedeepestspace/tbgwaf-dev
      dockerfile: ./Dockerfile
      target: dev
    secrets: inherit

  # --- Gameplay scenario review page (issue #14 stage 3, #190): build the
  # native runner once, record per-team WebM videos in parallel shards, and
  # collect them into the page inside the preview job. ---
  build_runner:
    needs: dev_image
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (native)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build visual scenario runner
        run: cmake --build build --target tactics_visual_tests tbgwaf_server_testctl

      # The runner reads its assets from the checkout (cwd), so the binary
      # alone is enough for the shards.
      - name: Upload runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-runner
          path: |
            build/tactics_visual_tests
            build/tbgwaf_server_testctl
          if-no-files-found: error
          retention-days: 1

  scenario_shard:
    needs: build_runner
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the base...head classification.
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: visual-runner
          path: build

      - name: Record shard
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
        run: |
          chmod +x build/tactics_visual_tests build/tbgwaf_server_testctl
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            python3 scripts/generate_scenario_review_page.py \
              --base ${{ github.event.pull_request.base.sha }} \
              --head ${{ github.event.pull_request.head.sha }} \
              --runner build/tactics_visual_tests \
              --server build/tbgwaf_server_testctl \
              --out scenarios-out \
              --shard ${{ matrix.shard }}/6

      - name: Upload shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-shard-${{ matrix.shard }}
          path: scenarios-out
          if-no-files-found: error
          retention-days: 1

  # Deploys the playable WASM build first; this creates pr-preview/pr-N (the
  # action replaces the whole directory), so the publish_* jobs below wait
  # for it and then add their results with plain commits.
  preview:
    needs: dev_image
    # The closed action skips the image builds and only cleans up the preview.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (needs.dev_image.result == 'success' || needs.dev_image.result == 'skipped') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scenario review page classifies scenarios as
          # new/modified/deleted via `git diff <base>...<head>`, which needs
          # the merge base to be present locally.
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (Emscripten)
        if: github.event.action != 'closed'
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          # Point the preview at this PR's backend (server-deploy.yml) when the PR has one.
          server_url=""
          [ -f server/Dockerfile ] && server_url="wss://tbgwaf-server-pr-${{ github.event.pull_request.number }}.fly.dev"
          emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DTBGWAF_SERVER_URL="$server_url"

      - name: Build tactics_app (WASM/WebGL2)
        if: github.event.action != 'closed'
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          cmake --build build-web

      - name: Assemble Pages site
        if: github.event.action != 'closed'
        run: |
          mkdir -p site site/gallery
          cp build-web/index.html site/
          cp build-web/tactics_app.js site/
          cp build-web/tactics_app.wasm site/
          cp build-web/jev-preview.js site/
          cp build-web/maps.js site/
          cp build-web/gallery.html site/gallery/index.html
          cp build-web/tactics_gallery.js site/gallery/
          cp build-web/tactics_gallery.wasm site/gallery/
          cp build-web/map_seeds.js site/gallery/
          cp -r build-web/map_goldens site/gallery/

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      # The pr-preview action's own sticky comment links only to the site
      # root (the playable build); add/refresh one direct link to the
      # scenario review page so reviewers can click straight through.
      - name: Link scenario review page on the PR
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- gameplay-scenario-review -->'
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/scenarios/"
          gallery_url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/gallery/"
          performance_url="https://${owner}.github.io/${repo}/performance/"
          pr_performance_url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/performance/"
          body="$(printf '%s\n%s\n\n%s' "$marker" "🎬 [Gameplay scenario review page](${url}) — per-team videos of every scenario, grouped by how this PR changes it, refreshed at commit \`${HEAD_SHA:0:7}\` (generated after the playable build is live, so it may take several minutes to appear after each push)." "🖼️ [Asset gallery](${gallery_url}) — browse models and animations, including this PR's changes.")"
          body="$(printf '%s\n\n%s' "$body" "📈 [PR performance](${pr_performance_url}) — pinned-map rendering measurements at \`${HEAD_SHA:0:7}\` (also published after the build), compared with the master baselines when available.")"
          # The master page only exists once the Performance suite has run on master.
          if curl -fsSIo /dev/null "$performance_url"; then
            body="$(printf '%s\n\n%s' "$body" "📊 [Master performance history](${performance_url})")"
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi

  performance:
    needs: dev_image
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scenario review page classifies scenarios as
          # new/modified/deleted via `git diff <base>...<head>`, which needs
          # the merge base to be present locally.
          fetch-depth: 0

      - name: Trust workspace for git
        # Container runs as root but the workspace is owned by the runner user;
        # without this `git diff` falls back to --no-index and exits 129.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"


      - name: Configure (native)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # --- Per-PR performance: measure the PR head and compare against the
      # master baselines preserved on gh-pages by the Performance suite. ---
      - name: Build performance runner
        run: cmake --build build --target tactics_performance_suite

      - name: Measure PR performance
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p performance-output site/performance
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            build/tactics_performance_suite \
              --seeds tests/performance/seeds.txt \
              --output performance-output/results.json \
              --warmup-frames 30 \
              --sample-frames 120 \
              --commit "$HEAD_SHA" \
              --target-ref "pr-${PR_NUMBER}" \
              --run-id "pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cp performance-output/results.json site/performance/results.json
          # Master baselines live on gh-pages; absent until the Performance
          # suite has run on master, in which case the page has no comparison.
          mkdir -p master-history
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD performance/history 2>/dev/null | tar -x -C master-history || true
          fi
          python3 scripts/generate_performance_report.py \
            --current performance-output/results.json \
            --history-dir master-history/performance/history \
            --out site/performance \
            --title "Performance suite · PR #${PR_NUMBER}" \
            --history-url ../../../performance/history/ \
            --current-url results.json

      - name: Upload performance site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-site
          path: site/performance
          if-no-files-found: error
          retention-days: 1

  # Publish jobs run after the preview deploy (which replaces the whole
  # pr-preview/pr-N directory) and add their files with a plain commit.
  # Publishes share one concurrency group with `queue: max` (up to 100 pending
  # jobs wait their turn instead of replacing each other), so gh-pages pushes
  # are serialized; publish_to_preview.sh's fetch-and-retry covers other
  # writers (e.g. pages.yml).
  publish_scenarios:
    needs: [preview, scenario_shard]
    if: ${{ github.event.action != 'closed' && needs.preview.result == 'success' && needs.scenario_shard.result == 'success' }}
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review page classifies scenarios via `git diff <base>...<head>`.
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download scenario shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scenario-shard-*
          path: site/scenarios
          merge-multiple: true

      - name: Generate scenario review page
        run: |
          python3 scripts/generate_scenario_review_page.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --out site/scenarios \
            --collect \
            --baseline-url ../../../scenario-baseline \
            --performance-url ../../../performance/
          rm -f site/scenarios/shard-*.json

      - name: Publish into the PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/publish_to_preview.sh "pr-preview/pr-${PR_NUMBER}" site

  publish_performance:
    needs: [preview, performance]
    if: ${{ github.event.action != 'closed' && needs.preview.result == 'success' && needs.performance.result == 'success' }}
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download performance site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: performance-site
          path: site/performance

      - name: Publish into the PR preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/publish_to_preview.sh "pr-preview/pr-${PR_NUMBER}" site
