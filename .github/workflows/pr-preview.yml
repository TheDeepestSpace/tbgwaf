name: Deploy PR preview to GitHub Pages

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Build PR-specific images (tag pr-<number>) so Dockerfile changes are
  # picked up without waiting for a merge to master. The dev stage builds on
  # the ci stage, so build ci first to warm the cache.
  ci_image:
    # Forked PRs don't get a token with write access, so previews are
    # limited to same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/thedeepestspace/tbgwaf-ci
      dockerfile: ./Dockerfile
      target: ci
    secrets: inherit

  dev_image:
    needs: ci_image
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/thedeepestspace/tbgwaf-dev
      dockerfile: ./Dockerfile
      target: dev
    secrets: inherit

  # --- Gameplay scenario review page (issue #14 stage 3, #190): build the
  # native runner once, record per-team WebM videos in parallel shards, and
  # collect them into the page inside the preview job. ---
  build_runner:
    needs: dev_image
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (native)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build visual scenario runner
        run: cmake --build build --target tactics_visual_tests

      # The runner reads its assets from the checkout (cwd), so the binary
      # alone is enough for the shards.
      - name: Upload runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-runner
          path: build/tactics_visual_tests
          if-no-files-found: error
          retention-days: 1

  scenario_shard:
    needs: build_runner
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the base...head classification.
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: visual-runner
          path: build

      - name: Record shard
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
        run: |
          chmod +x build/tactics_visual_tests
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            python3 scripts/generate_scenario_review_page.py \
              --base ${{ github.event.pull_request.base.sha }} \
              --head ${{ github.event.pull_request.head.sha }} \
              --runner build/tactics_visual_tests \
              --out scenarios-out \
              --shard ${{ matrix.shard }}/6

      - name: Upload shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-shard-${{ matrix.shard }}
          path: scenarios-out
          if-no-files-found: error
          retention-days: 1

  preview:
    needs: [dev_image, scenario_shard]
    # The closed action skips the image builds and only cleans up the preview.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (needs.dev_image.result == 'success' || needs.dev_image.result == 'skipped') && (needs.scenario_shard.result == 'success' || needs.scenario_shard.result == 'skipped') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:pr-${{ github.event.pull_request.number }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scenario review page classifies scenarios as
          # new/modified/deleted via `git diff <base>...<head>`, which needs
          # the merge base to be present locally.
          fetch-depth: 0

      - name: Trust workspace for git
        # Container runs as root but the workspace is owned by the runner user;
        # without this `git diff` falls back to --no-index and exits 129.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure (Emscripten)
        if: github.event.action != 'closed'
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          # Point the preview at this PR's backend (server-deploy.yml) when the PR has one.
          server_url=""
          [ -f server/Dockerfile ] && server_url="wss://tbgwaf-server-pr-${{ github.event.pull_request.number }}.fly.dev"
          emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DTBGWAF_SERVER_URL="$server_url"

      - name: Build tactics_app (WASM/WebGL2)
        if: github.event.action != 'closed'
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          cmake --build build-web

      - name: Assemble Pages site
        if: github.event.action != 'closed'
        run: |
          mkdir -p site site/gallery
          cp build-web/index.html site/
          cp build-web/tactics_app.js site/
          cp build-web/tactics_app.wasm site/
          cp build-web/jev-preview.js site/
          cp build-web/gallery.html site/gallery/index.html
          cp build-web/tactics_gallery.js site/gallery/
          cp build-web/tactics_gallery.wasm site/gallery/
          cp build-web/map_seeds.js site/gallery/
          cp -r build-web/map_goldens site/gallery/

      - name: Download scenario shards
        if: github.event.action != 'closed'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: scenario-shard-*
          path: site/scenarios
          merge-multiple: true

      - name: Generate scenario review page
        if: github.event.action != 'closed'
        run: |
          python3 scripts/generate_scenario_review_page.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --out site/scenarios \
            --collect \
            --baseline-url ../../../scenario-baseline
          rm -f site/scenarios/shard-*.json

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      # The pr-preview action's own sticky comment links only to the site
      # root (the playable build); add/refresh one direct link to the
      # scenario review page so reviewers can click straight through.
      - name: Link scenario review page on the PR
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- gameplay-scenario-review -->'
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/scenarios/"
          gallery_url="https://${owner}.github.io/${repo}/pr-preview/pr-${PR_NUMBER}/gallery/"
          body="$(printf '%s\n%s\n\n%s' "$marker" "🎬 [Gameplay scenario review page](${url}) — per-team videos of every scenario, grouped by how this PR changes it, refreshed at commit \`${HEAD_SHA:0:7}\` (updates with each push; may take a minute to go live after deploy)." "🖼️ [Asset gallery](${gallery_url}) — browse models and animations, including this PR's changes.")"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
