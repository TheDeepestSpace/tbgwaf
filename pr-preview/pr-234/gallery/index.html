<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>tbgwaf — asset &amp; animation gallery</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #16171a;
        color: #e6e6e6;
        font-family: -apple-system, system-ui, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      #layout {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      #sidebar {
        width: 230px;
        flex: 0 0 auto;
        overflow-y: auto;
        border-right: 1px solid #2a2c31;
        padding: 12px;
        box-sizing: border-box;
      }
      #sidebar h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      #sidebar h1 a { color: #8ab4ff; text-decoration: none; font-weight: normal; }
      #sidebar h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa0a6;
        margin: 16px 0 6px;
      }
      #sidebar button.item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-radius: 6px;
        color: #e6e6e6;
        font-size: 13px;
        padding: 6px 8px;
        cursor: pointer;
      }
      #sidebar button.item:hover { background: #24262b; }
      #sidebar button.item.active { background: #2d4a7a; }
      #main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #viewport {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #controls {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-top: 1px solid #2a2c31;
      }
      #controls button {
        background: #24262b;
        border: 1px solid #3a3d44;
        border-radius: 6px;
        color: #e6e6e6;
        width: 64px;
        padding: 5px 0;
        cursor: pointer;
      }
      #mapSeeds {
        flex: 1 1 auto;
        display: none;
        overflow-y: auto;
        min-height: 0;
        padding: 16px;
        box-sizing: border-box;
      }
      #mapSeeds .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      #mapSeeds figure {
        margin: 0;
        background: #1d1f23;
        border: 1px solid #2a2c31;
        border-radius: 8px;
        overflow: hidden;
      }
      #mapSeeds img { display: block; width: 100%; height: auto; }
      #mapSeeds figcaption { font-size: 12px; padding: 8px 10px; }
      #mapSeeds figcaption .seed { color: #9aa0a6; }
      #mapSeeds figure { cursor: pointer; }
      #mapSeeds figure:hover { border-color: #8ab4ff; }
      #seedModal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
      }
      #seedModal.open { display: flex; }
      #seedModalBox {
        position: relative;
        width: min(1200px, 94vw);
        height: min(800px, 90vh);
        background: #15171a;
        border: 1px solid #2a2c31;
        border-radius: 8px;
        overflow: hidden;
      }
      #seedModalBox canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #seedModalTitle { position: absolute; top: 10px; left: 14px; font-size: 13px; pointer-events: none; }
      #seedModalHint { position: absolute; bottom: 10px; left: 14px; font-size: 12px; color: #9aa0a6; pointer-events: none; }
      #seedModalClose {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #2a2c31;
        border: 1px solid #3a3c42;
        border-radius: 6px;
        color: #e6e6e6;
        padding: 4px 10px;
        cursor: pointer;
      }
      #scrub { flex: 1 1 auto; }
      #timeLabel { font-size: 12px; color: #9aa0a6; width: 90px; text-align: right; }
      #hint {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        color: #9aa0a6;
        pointer-events: none;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 13px;
      }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="sidebar">
        <h1>Asset gallery <a href="../">&larr; game</a></h1>
        <p style="margin:0 0 8px;font-size:12px"><a href="../scenarios/" style="color:#8ab4ff;text-decoration:none">Scenario review &rarr;</a> · <a id="performanceLink" href="../performance/" style="color:#8ab4ff;text-decoration:none">Performance &rarr;</a></p>
        <div id="items"></div>
      </div>
      <div id="main">
        <div id="viewport">
          <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
          <div id="status">Loading...</div>
          <div id="hint">drag to orbit &middot; scroll to zoom</div>
        </div>
        <div id="controls">
          <button id="playBtn">Pause</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <span id="timeLabel"></span>
        </div>
        <div id="mapSeeds"><div class="grid"></div></div>
      </div>
    </div>
    <div id="seedModal">
      <div id="seedModalBox">
        <canvas></canvas>
        <div id="seedModalTitle"></div>
        <div id="seedModalHint">left-drag to pan &middot; right-drag to rotate &middot; scroll to zoom</div>
        <button id="seedModalClose">Close</button>
      </div>
    </div>
    <!-- Generated at build time from tests/map_goldens/ (see
         scripts/gen_gallery_map_seeds.cmake); defines MAP_SEED_GOLDENS. -->
    <script>
      var THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
      // A PR gallery is nested three levels below the repository root;
      // performance history is shared at the production Pages root.
      if (location.pathname.indexOf("/pr-preview/") !== -1) {
        document.getElementById("performanceLink").href = "../../../performance/";
      }
    </script>
    <script src="map_seeds.js"></script>
    <script src="tactics_gallery.js"></script>
    <script>
      var statusEl = document.getElementById("status");
      window.onerror = function () {
        statusEl.innerText = "Failed to load -- check the browser console.";
      };
      createTbgwafGalleryModule({
        canvas: document.querySelector("#viewport canvas"),
        onRuntimeInitialized: function () {
          statusEl.innerText = "";
          initUi(this);
        },
      });

      function initUi(mod) {
        var itemsEl = document.getElementById("items");
        var playBtn = document.getElementById("playBtn");
        var scrub = document.getElementById("scrub");
        var timeLabel = document.getElementById("timeLabel");
        var count = mod.ccall("gallery_item_count", "number", [], []);
        var buttons = [];

        function addGroup(title) {
          var h = document.createElement("h2");
          h.innerText = title;
          itemsEl.appendChild(h);
        }
        function addItem(i) {
          var b = document.createElement("button");
          b.className = "item";
          b.innerText = mod.ccall("gallery_item_label", "string", ["number"], [i]);
          b.onclick = function () { select(i); };
          itemsEl.appendChild(b);
          buttons[i] = b;
        }
        // The catalog is weapon turntables first, then animations (see
        // gallery::Catalog()); group the sidebar the same way.
        addGroup("Weapon models");
        for (var i = 0; i < count; ++i) {
          if (mod.ccall("gallery_item_kind", "number", ["number"], [i]) === 0) addItem(i);
        }
        addGroup("Animations");
        for (var j = 0; j < count; ++j) {
          if (mod.ccall("gallery_item_kind", "number", ["number"], [j]) === 1) addItem(j);
        }

        // Map-seed goldens (issue #133): a static tile grid driven by the
        // build-time manifest, shown in place of the 3D viewport.
        var viewportEl = document.getElementById("viewport");
        var controlsEl = document.getElementById("controls");
        var mapSeedsEl = document.getElementById("mapSeeds");
        var mapSeedsBtn = null;
        var mapSeeds = window.MAP_SEED_GOLDENS || [];
        if (mapSeeds.length) {
          addGroup("Map seeds");
          mapSeedsBtn = document.createElement("button");
          mapSeedsBtn.className = "item";
          mapSeedsBtn.innerText = "All seeds (" + mapSeeds.length + ")";
          mapSeedsBtn.onclick = showMapSeeds;
          itemsEl.appendChild(mapSeedsBtn);

          var grid = mapSeedsEl.querySelector(".grid");
          mapSeeds.forEach(function (file) {
            // e.g. "city_overpass_through_seed_4.png" -> type "city
            // overpass through", seed 4.
            var m = file.replace(/\.png$/, "").match(/^(.*)_seed_(\d+)$/);
            var fig = document.createElement("figure");
            var img = document.createElement("img");
            img.src = "map_goldens/" + file;
            img.loading = "lazy";
            img.alt = file;
            var cap = document.createElement("figcaption");
            if (m) {
              cap.appendChild(document.createTextNode(m[1].replace(/_/g, " ") + " "));
              var seed = document.createElement("span");
              seed.className = "seed";
              seed.innerText = "seed " + m[2];
              cap.appendChild(seed);
            } else {
              cap.innerText = file;
            }
            fig.appendChild(img);
            fig.appendChild(cap);
            if (m) {
              // "city_random_x4_seed_6805" is an 8x8 map; every other
              // seed golden is the 4x4 city.
              fig.title = "Click to view in 3D";
              fig.onclick = function () {
                openSeedModal(m[1].replace(/_/g, " ") + " seed " + m[2], Number(m[2]),
                              /_x4$/.test(m[1]));
              };
            }
            grid.appendChild(fig);
          });
        }


        // 3D seed viewer: the WASM module regenerates the map and returns
        // its geometry as JSON; three.js (loaded on first use) draws it
        // with the game's camera feel -- left-drag grabs/pans the ground,
        // right-drag rotates, wheel zooms.
        var seedModal = document.getElementById("seedModal");
        var seedCanvas = seedModal.querySelector("canvas");
        var seedViewer = null;
        document.getElementById("seedModalClose").onclick = closeSeedModal;
        seedModal.addEventListener("mousedown", function (e) {
          if (e.target === seedModal) closeSeedModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") closeSeedModal();
        });
        function closeSeedModal() {
          seedModal.classList.remove("open");
          if (seedViewer) seedViewer.stop();
        }
        function openSeedModal(title, seed, x4) {
          var titleEl = document.getElementById("seedModalTitle");
          titleEl.innerText = title + " \u2014 generating...";
          seedModal.classList.add("open");
          Promise.all([import(THREE_URL), new Promise(function (r) { setTimeout(r, 30); })])
            .then(function (res) {
              var json = mod.ccall("gallery_map_json", "string", ["number", "number"], [seed, x4 ? 1 : 0]);
              if (!seedViewer) seedViewer = createSeedViewer(res[0], seedCanvas);
              seedViewer.show(JSON.parse(json));
              titleEl.innerText = title;
            })
            .catch(function (err) {
              titleEl.innerText = title + " \u2014 failed: " + err;
            });
        }

        function createSeedViewer(THREE, canvas) {
          var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
          var scene = new THREE.Scene();
          scene.background = new THREE.Color(0x15171a);
          scene.add(new THREE.HemisphereLight(0xffffff, 0x555560, 1.6));
          var sun = new THREE.DirectionalLight(0xffffff, 1.6);
          sun.position.set(0.5, 1, 0.3);
          scene.add(sun);
          var camera = new THREE.PerspectiveCamera(45, 1, 1, 4000);
          var content = null;
          var target = new THREE.Vector3();
          var yaw = 0.8, pitch = 0.9, dist = 200, maxDist = 1000;
          var raf = 0;
          var BUILDING_COLORS = [0x9a9a9a, 0xb5846b, 0xa9a28f, 0x6f8fa8, 0xa0a0a8, 0xd0b878, 0x8a8a84];
          var POLY_COLORS = [0x33353a, 0x8c8c90, 0x6b7a8f];

          function material(color, offset) {
            return new THREE.MeshLambertMaterial({
              color: color, side: THREE.DoubleSide, flatShading: true,
              polygonOffset: !!offset, polygonOffsetFactor: -offset, polygonOffsetUnits: -offset
            });
          }

          function build(map) {
            var group = new THREE.Group();
            var g = map.ground;
            if (g) {
              var pos = [], idx = [];
              for (var iz = 0; iz < g.nz; ++iz)
                for (var ix = 0; ix < g.nx; ++ix)
                  pos.push(g.minX + ix * g.step, g.h[iz * g.nx + ix], g.minZ + iz * g.step);
              for (var z = 0; z + 1 < g.nz; ++z)
                for (var x = 0; x + 1 < g.nx; ++x) {
                  var a = z * g.nx + x, b = a + 1, c = a + g.nx, d = c + 1;
                  idx.push(a, c, b, b, c, d);
                }
              var gg = new THREE.BufferGeometry();
              gg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
              gg.setIndex(idx);
              gg.computeVertexNormals();
              group.add(new THREE.Mesh(gg, material(0x4a5a46, 0)));
            } else {
              var plane = new THREE.Mesh(new THREE.PlaneGeometry(map.half * 2, map.half * 2),
                                         material(0x4a5a46, 0));
              plane.rotation.x = -Math.PI / 2;
              plane.position.y = -0.05;
              group.add(plane);
            }

            // Prisms batched per colour: top fan + side quads per footprint.
            var byKind = {};
            map.prisms.forEach(function (p) {
              var arr = byKind[p.k] || (byKind[p.k] = []);
              var n = p.fp.length / 2;
              for (var i = 1; i + 1 < n; ++i)
                arr.push(p.fp[0], p.y1, p.fp[1], p.fp[2 * i], p.y1, p.fp[2 * i + 1],
                         p.fp[2 * i + 2], p.y1, p.fp[2 * i + 3]);
              for (var j = 0; j < n; ++j) {
                var k = (j + 1) % n;
                var x0 = p.fp[2 * j], z0 = p.fp[2 * j + 1], x1 = p.fp[2 * k], z1 = p.fp[2 * k + 1];
                arr.push(x0, p.y0, z0, x1, p.y0, z1, x1, p.y1, z1,
                         x0, p.y0, z0, x1, p.y1, z1, x0, p.y1, z0);
              }
            });
            Object.keys(byKind).forEach(function (k) {
              var geo = new THREE.BufferGeometry();
              geo.setAttribute("position", new THREE.Float32BufferAttribute(byKind[k], 3));
              geo.computeVertexNormals();
              group.add(new THREE.Mesh(geo, material(BUILDING_COLORS[k] || 0x9a9a9a, 0)));
            });

            // Flat polygons (roads, sidewalks, bridge decks/ramps), fan-triangulated.
            var byType = [[], [], []];
            map.polys.forEach(function (p) {
              var v = p.v, n = v.length / 3, arr = byType[p.t];
              for (var i = 1; i + 1 < n; ++i)
                arr.push(v[0], v[1], v[2], v[3 * i], v[3 * i + 1], v[3 * i + 2],
                         v[3 * i + 3], v[3 * i + 4], v[3 * i + 5]);
            });
            byType.forEach(function (arr, t) {
              if (!arr.length) return;
              var geo = new THREE.BufferGeometry();
              geo.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
              geo.computeVertexNormals();
              group.add(new THREE.Mesh(geo, material(POLY_COLORS[t], 1 + t)));
            });
            return group;
          }

          function resize() {
            var w = canvas.clientWidth, h = canvas.clientHeight;
            if (canvas.width !== w || canvas.height !== h) {
              renderer.setPixelRatio(window.devicePixelRatio || 1);
              renderer.setSize(w, h, false);
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
            }
          }
          function frame() {
            resize();
            var cp = Math.cos(pitch);
            camera.position.set(target.x + dist * cp * Math.cos(yaw),
                                target.y + dist * Math.sin(pitch),
                                target.z + dist * cp * Math.sin(yaw));
            camera.lookAt(target);
            renderer.render(scene, camera);
            raf = requestAnimationFrame(frame);
          }

          var drag = null;
          canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
          canvas.addEventListener("pointerdown", function (e) {
            drag = { button: e.button, x: e.clientX, y: e.clientY };
            canvas.setPointerCapture(e.pointerId);
          });
          canvas.addEventListener("pointerup", function () { drag = null; });
          canvas.addEventListener("pointermove", function (e) {
            if (!drag) return;
            var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            drag.x = e.clientX;
            drag.y = e.clientY;
            if (drag.button === 0) {
              // Grab the ground: it follows the cursor.
              var perPx = 2 * dist * Math.tan(camera.fov * Math.PI / 360) / canvas.clientHeight;
              var fx = -Math.cos(yaw), fz = -Math.sin(yaw);  // ground-forward
              var rx = -fz, rz = fx;                          // ground-right
              target.x -= (dx * rx - dy * fx) * perPx;
              target.z -= (dx * rz - dy * fz) * perPx;
            } else {
              yaw -= dx * 0.01;
              pitch = Math.max(0.05, Math.min(1.5, pitch + dy * 0.01));
            }
          });
          canvas.addEventListener("wheel", function (e) {
            e.preventDefault();
            dist = Math.max(10, Math.min(maxDist, dist * Math.exp(e.deltaY * 0.001)));
          }, { passive: false });

          return {
            show: function (map) {
              if (content) {
                scene.remove(content);
                content.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
              }
              content = build(map);
              scene.add(content);
              target.set(0, 0, 0);
              maxDist = map.half * 5;
              dist = map.half * 2.2;
              cancelAnimationFrame(raf);
              frame();
            },
            stop: function () { cancelAnimationFrame(raf); }
          };
        }

        function showMapSeeds() {
          viewportEl.style.display = "none";
          controlsEl.style.display = "none";
          mapSeedsEl.style.display = "block";
          buttons.forEach(function (b) { b.classList.remove("active"); });
          mapSeedsBtn.classList.add("active");
        }

        function select(i) {
          viewportEl.style.display = "";
          controlsEl.style.display = "";
          mapSeedsEl.style.display = "";
          if (mapSeedsBtn) mapSeedsBtn.classList.remove("active");
          mod.ccall("gallery_select", null, ["number"], [i]);
          buttons.forEach(function (b, k) { b.classList.toggle("active", k === i); });
        }
        select(0);

        playBtn.onclick = function () {
          var playing = mod.ccall("gallery_playing", "number", [], []) !== 0;
          mod.ccall("gallery_set_playing", null, ["number"], [playing ? 0 : 1]);
        };
        scrub.oninput = function () {
          var sel = mod.ccall("gallery_selected", "number", [], []);
          var duration = mod.ccall("gallery_item_duration", "number", ["number"], [sel]);
          mod.ccall("gallery_set_time", null, ["number"], [(scrub.value / 1000) * duration]);
        };

        (function refresh() {
          var sel = mod.ccall("gallery_selected", "number", [], []);
          var duration = mod.ccall("gallery_item_duration", "number", ["number"], [sel]);
          var t = mod.ccall("gallery_time", "number", [], []);
          var playing = mod.ccall("gallery_playing", "number", [], []) !== 0;
          playBtn.innerText = playing ? "Pause" : "Play";
          if (playing) scrub.value = Math.round((t / duration) * 1000);
          timeLabel.innerText = t.toFixed(2) + " / " + duration.toFixed(2) + " s";
          requestAnimationFrame(refresh);
        })();
      }
    </script>
  </body>
</html>
