# Elevated urban variant (issue #92): blue starts at the declared ground
# connection and moves several patches up the generated ramp. The asserted Y
# proves the gameplay path follows the ramp layer rather than remaining on
# ground or teleporting onto the deck. The map golden separately shows ground
# access below the edge-to-edge highway and its support spacing.
name: elevated_highway_ramp

map:
  generate: {type: urban, seed: 7, arteries: 2, elevated: true}

units:
  - {id: 0, team: blue, position: [-30.6839, 0.00568, -70.6705], facing_degrees: 90}
  - {id: 1, team: red, position: [60, 0, 55], facing_degrees: 180}

camera:
  target: [-30.5, -63]
  zoom: 22

script:
  - action: move
    actor: 0
    destination: [-30.5039, 0.13492, -62.5577]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-30.5039, 0.13492, -62.5577], tolerance: 0.05}
  - assert: {round: 2}
