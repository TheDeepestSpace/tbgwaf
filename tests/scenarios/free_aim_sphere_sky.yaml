name: free_aim_sphere_sky
description: >
  Issue #129 sky aim: a camera ray that hits no aimable surface resolves onto the
  adjustable sphere around the figure. The aim step captures the sphere + "+" selector +
  radius slider UI; confirming and committing fires the (harmless) sky shot and leaves the
  figure facing the aim direction.

units:
  - {id: 0, team: blue, position: [-4, 0, 0], facing_degrees: 90}
  - {id: 1, team: red, position: [8, 0, 8], facing_degrees: 180}

script:
  - action: aim
    description: An upward ray misses every surface, so the point lands on the aiming sphere (radius pinned at 12).
    actor: 0
    aim_from: [-4, 2, 0]
    aim_dir: [0.4, 1, 0.4]
    sphere_radius: 12
  - action: shoot
    actor: 0
    confirm: true
  - action: pass
    actor: 1
  - action: commit

  - assert: {unit: 0, facing_degrees: 45, tolerance: 1.5, comment: Faces the sky point's bearing}
  - assert: {unit: 1, alive: true}
  - assert: {round: 2}
