name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Same-repo PRs build a PR-specific image (tag pr-<number>) so changes to
  # the Dockerfile are tested immediately; everything else uses :latest.
  ci_image:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ghcr.io/thedeepestspace/tbgwaf-ci
      dockerfile: ./Dockerfile
      target: ci
    secrets: inherit

  select_ci_image:
    needs: ci_image
    if: always() # don't skip if ci_image is skipped
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - id: image
        env:
          BUILT_TAG: ${{ needs.ci_image.outputs.image-primary-tag }}
          BUILD_RESULT: ${{ needs.ci_image.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] && [ "$BUILD_RESULT" != "skipped" ]; then
            echo "::error::ci_image $BUILD_RESULT"
            exit 1
          fi
          echo "tag=${BUILT_TAG:-ghcr.io/thedeepestspace/tbgwaf-ci:latest}" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: select_ci_image
    if: ${{ !cancelled() && needs.select_ci_image.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.select_ci_image.outputs.image-tag }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check flow/app_flow.mmd is in sync with flow/app_flow.yaml
        run: |
          python3 scripts/gen_flow.py flow/app_flow.yaml \
            --header "$RUNNER_TEMP/AppFlow.h" --mermaid "$RUNNER_TEMP/app_flow.mmd" \
            --templates flow/templates
          diff -u flow/app_flow.mmd "$RUNNER_TEMP/app_flow.mmd" || {
            echo "::error::flow/app_flow.mmd is stale; regenerate with scripts/gen_flow.py"
            exit 1
          }

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload visual test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual_out
          path: build/visual_out
