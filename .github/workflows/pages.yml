name: Deploy WASM build to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: latest

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-yaml

      - name: Configure (Emscripten)
        run: emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tactics_app (WASM/WebGL2)
        run: cmake --build build-web

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp build-web/index.html site/
          cp build-web/tactics_app.js site/
          cp build-web/tactics_app.wasm site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Preserve the pr-preview/pr-*/ subdirectories maintained by
          # pr-preview.yml on this same branch.
          keep_files: true
