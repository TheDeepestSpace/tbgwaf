# Issue #103: on urban-elevated, a ground-level viewer facing the overpass's
# west ramp must see the cone shadowed under the deck and laid on the ramp
# top, not flowing underneath. Visual-only check (goldens); the assert just
# keeps the scenario meaningful as a state test.
name: fov_cone_bridge_deck

map:
  generate: {type: urban, seed: 7, arteries: 2, elevated: true, elevated_layout: ramp-up-ramp-down}

units:
  - {id: 0, team: blue, position: [-72, 0, 14.5], facing_degrees: -10}
  - {id: 1, team: red, position: [60, 0, -18], facing_degrees: 180}

camera:
  target: [-60, 14]
  zoom: 40

script:
  - action: pass
    actor: 0
  - action: pass
    actor: 1
  - action: commit
  - assert: {round: 2}
