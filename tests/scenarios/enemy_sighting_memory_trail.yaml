name: enemy_sighting_memory_trail
description: >
  Showcases enemy ghosts: red starts in blue's FOV, then runs out of it. The wireframe trail and
  movement arrow of where blue saw red are shown as the turn ends and then fade out in the
  order they appeared (the wait step captures the mid-fade), while red itself is hidden.

map:
  obstacles: []

units:
  - {id: 0, team: blue, position: [-14, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [-4, 0, -2], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: true}

  - action: pass
    actor: 0
  - action: move
    actor: 1
    destination: [-12, 0, 14]
    comment: Crosses blue's 150 degree cone edge near the end
  - action: commit
  - assert: {unit: 1, visible_to: blue, visible: false}

  - action: wait
    seconds: 0.3
    description: Mid-fade; the ghosts fade in the order they appeared.

  - action: pass
    description: Nothing moves; the earlier ghosts are gone.
    actor: 0
  - action: pass
    actor: 1
  - action: commit
