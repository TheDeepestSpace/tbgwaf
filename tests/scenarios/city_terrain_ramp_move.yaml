# The blue figure climbs a reserved entrance through a retaining-wall gap.
# This also pins terrain-following pavement and the shadow-map FOV receivers.
name: city_terrain_ramp_move
map:
  generate:
    type: urban
    seed: 7
    elevated: false
    features: {terrain: on}
    terrain_amplitude: 3.0
    terrace_count: -1
    cliff_chance: 0.5
units:
  - {id: 0, team: blue, position: [-0.98, 0, -12.13], facing_degrees: -105}
  - {id: 1, team: red, position: [-65, 0, 10], facing_degrees: 0}
camera:
  target: [-5, -18]
  zoom: -120
render: {fov_overlay: shadow_map}
script:
  - assert: {unit: 0, position: [-0.98, 0.497, -12.13], tolerance: 0.05}
  - action: move
    actor: 0
    destination: [-3.61, 3.383, -21.70]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-3.61, 3.383, -21.70], tolerance: 0.05}
  - assert: {round: 2}
