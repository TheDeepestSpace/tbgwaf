<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tbgwaf</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #16171a;
        color: #e6e6e6;
        font-family: -apple-system, system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 20;
        font-size: 12px;
        opacity: 0.8;
        text-align: right;
      }
      #hud a { color: #9cc4ff; }
      #status:empty { display: none; }
      canvas#canvas {
        background: #000;
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      /* Covers the canvas on the tab whose team is not on the move: a
         strong blur (plus a slight dim) so board state is unreadable. */
      #blur-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        backdrop-filter: blur(28px) brightness(0.6);
        -webkit-backdrop-filter: blur(28px) brightness(0.6);
        align-items: center;
        justify-content: center;
        font-size: 22px;
        text-shadow: 0 1px 4px #000;
      }
      #blur-overlay.on { display: flex; }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      width="1280"
      height="720"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>
    <div id="blur-overlay"><span id="blur-text">Waiting for the other player...</span></div>
    <div id="hud">
      <div id="who"></div>
      <div id="status">Loading...</div>
    </div>
    <script type="text/javascript">
      var Module = {
        canvas: document.getElementById("canvas"),
        setStatus: function (text) {
          document.getElementById("status").innerText = text;
        },
      };
      (function () {
        var player = new URLSearchParams(window.location.search).get("player");
        var who = document.getElementById("who");
        if (player === "blue" || player === "red") {
          document.title = "tbgwaf - " + player;
          who.textContent = "Playing as " + player + ". Open the other player in a second tab: ";
          var other = player === "blue" ? "red" : "blue";
          who.innerHTML += '<a href="?player=' + other + '" target="_blank">' + other + "</a>";
        } else {
          who.innerHTML =
            'Hot-seat mode. Two-tab play: <a href="?player=blue" target="_blank">Blue</a> / ' +
            '<a href="?player=red" target="_blank">Red</a>';
        }
      })();
      window.onerror = function () {
        Module.setStatus("Failed to load -- check the browser console.");
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
