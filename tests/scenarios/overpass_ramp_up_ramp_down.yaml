# Issue #130: seed-driven overpass layouts. Pins the ramp-up-ramp-down
# layout (both artery ramps on-map) for seed 7 and walks Blue up the branch
# ramp that connects grade to the elevated deck. The asserted Y proves the
# figure climbed the connecting ramp; the goldens show the deck rising from
# grade at both map edges.
name: overpass_ramp_up_ramp_down

map:
  generate: {type: urban, seed: 7, arteries: 2, elevated: true, elevated_layout: ramp-up-ramp-down}

units:
  - {id: 0, team: blue, position: [-32.2965, 0.5268, -12.9465], facing_degrees: 21}
  - {id: 1, team: red, position: [65.8291, 0, -19.4045], facing_degrees: 180}

camera:
  target: [-25.8, -10.5]
  zoom: 34

script:
  - action: move
    actor: 0
    destination: [-19.3479, 2.211, -8.09341]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-19.3479, 2.211, -8.09341], tolerance: 0.05}
  - assert: {round: 2}
