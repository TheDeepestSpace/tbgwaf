# Source of truth for the app-level screen flow (Splash -> Game Mode -> Map Select / Builder -> gameplay,
# plus the Room screen for online two-player matches, shown only when a game server is
# configured).
# Consumed at build time only (never parsed at runtime) by scripts/gen_flow.py,
# which emits the C++ state enum/transition table and a Mermaid/SVG diagram.
# Keep to this restricted shape: top-level `initial`, `states` list and
# `transitions` list of flow-style maps.
# `opponent` follows Map Select (the map and mode are already chosen): Local, Online (2 players)
# or Play vs AI. Without a game server the app skips it straight to Local.
# `room` is an ImGui screen like the others (src/ui/Menu.cpp): New room / join by code; the
# room carries the map/mode chosen before it.
# `my_games` and `continue_game` live on the Splash (not part of a new game): My games (online
# only) lists this device's stored two-player matches: open one to resume it (active) or
# replay it (finished). `continue_game` -- on the Splash and on My Games -- resumes the last
# match this device played.
initial: splash
states:
  - {id: splash, label: Splash}
  - {id: game_mode, label: Game Mode}
  - {id: map_select, label: Map Select}
  - {id: builder, label: Builder}
  - {id: builder_edit, label: Builder Editor}
  - {id: opponent, label: Opponent}
  - {id: room, label: Room}
  - {id: my_games, label: My Games}
  - {id: gameplay, label: Gameplay}
transitions:
  - {from: splash, event: new_game, to: game_mode}
  - {from: splash, event: continue_game, to: gameplay}
  - {from: splash, event: select_my_games, to: my_games}
  - {from: game_mode, event: select_regular, to: map_select}
  - {from: game_mode, event: select_ctf, to: map_select}
  - {from: game_mode, event: select_builder, to: builder}
  - {from: game_mode, event: back, to: splash}
  - {from: map_select, event: select_urban, to: opponent}
  - {from: map_select, event: select_urban_x4, to: opponent}
  - {from: map_select, event: select_hills, to: opponent}
  - {from: map_select, event: back, to: game_mode}
  - {from: opponent, event: start_local, to: gameplay}
  - {from: opponent, event: select_online, to: room}
  - {from: opponent, event: create_ai_room, to: gameplay}
  - {from: opponent, event: back, to: map_select}
  - {from: builder, event: open_builder_scene, to: builder_edit}
  - {from: builder, event: exit_builder, to: game_mode}
  - {from: builder_edit, event: start_builder_game, to: gameplay}
  - {from: builder_edit, event: back_to_builder, to: builder}
  - {from: gameplay, event: back_to_builder, to: builder}
  - {from: room, event: create_room, to: gameplay}
  - {from: room, event: join_room, to: gameplay}
  - {from: room, event: back, to: opponent}
  - {from: my_games, event: continue_game, to: gameplay}
  - {from: my_games, event: open_game, to: gameplay}
  - {from: my_games, event: back, to: splash}
