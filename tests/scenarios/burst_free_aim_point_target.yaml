name: burst_free_aim_point_target
description: >
  Bursts work for free-aim point-target shots too (issues #138 + #129 + #140): the shooter
  places a blind-fire aim point on the enemy's torso and fires a 5-shot burst at it. Every
  bullet flies its own scattered line inside the weapon's cone; only bullets whose line
  actually crosses the figure roll against the hit chance (the pinned roll always hits),
  so the burst downs the figure with one of the bullets that land on the body.

units:
  - {id: 0, team: blue, position: [-8, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [8, 0, 0], facing_degrees: 180}

shot_rolls: [0.05, 0.05, 0.05, 0.05, 0.05]

script:
  - action: shoot
    description: Free-aim burst at the point where the enemy stands (protocol form, no lock-on).
    actor: 0
    at: [8, 0.9, 0]
    shots: 5
  - action: pass
    actor: 1
  - action: commit

  - assert: {unit: 1, alive: false, comment: A bullet of the burst connected}
  - assert: {unit: 0, facing_degrees: 0, tolerance: 1.0, comment: Turned onto the aim point}
  - assert: {winner: blue}
