name: Deploy WASM build to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-dev:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (Emscripten)
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tactics_app (WASM/WebGL2)
        run: |
          . /opt/emsdk/emsdk_env.sh > /dev/null
          cmake --build build-web

      - name: Assemble Pages site
        run: |
          mkdir -p site site/gallery
          cp build-web/index.html site/
          cp build-web/tactics_app.js site/
          cp build-web/tactics_app.wasm site/
          cp build-web/gallery.html site/gallery/index.html
          cp build-web/tactics_gallery.js site/gallery/
          cp build-web/tactics_gallery.wasm site/gallery/
          cp build-web/map_seeds.js site/gallery/
          cp -r build-web/map_goldens site/gallery/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Preserve the pr-preview/pr-*/ subdirectories maintained by
          # pr-preview.yml on this same branch.
          keep_files: true
