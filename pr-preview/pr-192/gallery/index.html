<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>tbgwaf — asset &amp; animation gallery</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #16171a;
        color: #e6e6e6;
        font-family: -apple-system, system-ui, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      #layout {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      #sidebar {
        width: 230px;
        flex: 0 0 auto;
        overflow-y: auto;
        border-right: 1px solid #2a2c31;
        padding: 12px;
        box-sizing: border-box;
      }
      #sidebar h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      #sidebar h1 a { color: #8ab4ff; text-decoration: none; font-weight: normal; }
      #sidebar h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9aa0a6;
        margin: 16px 0 6px;
      }
      #sidebar button.item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-radius: 6px;
        color: #e6e6e6;
        font-size: 13px;
        padding: 6px 8px;
        cursor: pointer;
      }
      #sidebar button.item:hover { background: #24262b; }
      #sidebar button.item.active { background: #2d4a7a; }
      #main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #viewport {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
      }
      #viewport canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #controls {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-top: 1px solid #2a2c31;
      }
      #controls button {
        background: #24262b;
        border: 1px solid #3a3d44;
        border-radius: 6px;
        color: #e6e6e6;
        width: 64px;
        padding: 5px 0;
        cursor: pointer;
      }
      #mapSeeds {
        flex: 1 1 auto;
        display: none;
        overflow-y: auto;
        min-height: 0;
        padding: 16px;
        box-sizing: border-box;
      }
      #mapSeeds .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      #mapSeeds figure {
        margin: 0;
        background: #1d1f23;
        border: 1px solid #2a2c31;
        border-radius: 8px;
        overflow: hidden;
      }
      #mapSeeds img { display: block; width: 100%; height: auto; }
      #mapSeeds figcaption { font-size: 12px; padding: 8px 10px; }
      #mapSeeds figcaption .seed { color: #9aa0a6; }
      #scrub { flex: 1 1 auto; }
      #timeLabel { font-size: 12px; color: #9aa0a6; width: 90px; text-align: right; }
      #hint {
        position: absolute;
        left: 12px;
        bottom: 10px;
        font-size: 12px;
        color: #9aa0a6;
        pointer-events: none;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 13px;
      }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="sidebar">
        <h1>Asset gallery <a href="../">&larr; game</a></h1>
        <p style="margin:0 0 8px;font-size:12px"><a href="../scenarios/" style="color:#8ab4ff;text-decoration:none">Scenario review &rarr;</a></p>
        <div id="items"></div>
      </div>
      <div id="main">
        <div id="viewport">
          <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
          <div id="status">Loading...</div>
          <div id="hint">drag to orbit &middot; scroll to zoom</div>
        </div>
        <div id="controls">
          <button id="playBtn">Pause</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <span id="timeLabel"></span>
        </div>
        <div id="mapSeeds"><div class="grid"></div></div>
      </div>
    </div>
    <!-- Generated at build time from tests/map_goldens/ (see
         scripts/gen_gallery_map_seeds.cmake); defines MAP_SEED_GOLDENS. -->
    <script src="map_seeds.js"></script>
    <script src="tactics_gallery.js"></script>
    <script>
      var statusEl = document.getElementById("status");
      window.onerror = function () {
        statusEl.innerText = "Failed to load -- check the browser console.";
      };
      createTbgwafGalleryModule({
        canvas: document.querySelector("#viewport canvas"),
        onRuntimeInitialized: function () {
          statusEl.innerText = "";
          initUi(this);
        },
      });

      function initUi(mod) {
        var itemsEl = document.getElementById("items");
        var playBtn = document.getElementById("playBtn");
        var scrub = document.getElementById("scrub");
        var timeLabel = document.getElementById("timeLabel");
        var count = mod.ccall("gallery_item_count", "number", [], []);
        var buttons = [];

        function addGroup(title) {
          var h = document.createElement("h2");
          h.innerText = title;
          itemsEl.appendChild(h);
        }
        function addItem(i) {
          var b = document.createElement("button");
          b.className = "item";
          b.innerText = mod.ccall("gallery_item_label", "string", ["number"], [i]);
          b.onclick = function () { select(i); };
          itemsEl.appendChild(b);
          buttons[i] = b;
        }
        // The catalog is weapon turntables first, then animations (see
        // gallery::Catalog()); group the sidebar the same way.
        addGroup("Weapon models");
        for (var i = 0; i < count; ++i) {
          if (mod.ccall("gallery_item_kind", "number", ["number"], [i]) === 0) addItem(i);
        }
        addGroup("Animations");
        for (var j = 0; j < count; ++j) {
          if (mod.ccall("gallery_item_kind", "number", ["number"], [j]) === 1) addItem(j);
        }

        // Map-seed goldens (issue #133): a static tile grid driven by the
        // build-time manifest, shown in place of the 3D viewport.
        var viewportEl = document.getElementById("viewport");
        var controlsEl = document.getElementById("controls");
        var mapSeedsEl = document.getElementById("mapSeeds");
        var mapSeedsBtn = null;
        var mapSeeds = window.MAP_SEED_GOLDENS || [];
        if (mapSeeds.length) {
          addGroup("Map seeds");
          mapSeedsBtn = document.createElement("button");
          mapSeedsBtn.className = "item";
          mapSeedsBtn.innerText = "All seeds (" + mapSeeds.length + ")";
          mapSeedsBtn.onclick = showMapSeeds;
          itemsEl.appendChild(mapSeedsBtn);

          var grid = mapSeedsEl.querySelector(".grid");
          mapSeeds.forEach(function (file) {
            // e.g. "city_overpass_through_seed_4.png" -> type "city
            // overpass through", seed 4.
            var m = file.replace(/\.png$/, "").match(/^(.*)_seed_(\d+)$/);
            var fig = document.createElement("figure");
            var img = document.createElement("img");
            img.src = "map_goldens/" + file;
            img.loading = "lazy";
            img.alt = file;
            var cap = document.createElement("figcaption");
            if (m) {
              cap.appendChild(document.createTextNode(m[1].replace(/_/g, " ") + " "));
              var seed = document.createElement("span");
              seed.className = "seed";
              seed.innerText = "seed " + m[2];
              cap.appendChild(seed);
            } else {
              cap.innerText = file;
            }
            fig.appendChild(img);
            fig.appendChild(cap);
            grid.appendChild(fig);
          });
        }

        function showMapSeeds() {
          viewportEl.style.display = "none";
          controlsEl.style.display = "none";
          mapSeedsEl.style.display = "block";
          buttons.forEach(function (b) { b.classList.remove("active"); });
          mapSeedsBtn.classList.add("active");
        }

        function select(i) {
          viewportEl.style.display = "";
          controlsEl.style.display = "";
          mapSeedsEl.style.display = "";
          if (mapSeedsBtn) mapSeedsBtn.classList.remove("active");
          mod.ccall("gallery_select", null, ["number"], [i]);
          buttons.forEach(function (b, k) { b.classList.toggle("active", k === i); });
        }
        select(0);

        playBtn.onclick = function () {
          var playing = mod.ccall("gallery_playing", "number", [], []) !== 0;
          mod.ccall("gallery_set_playing", null, ["number"], [playing ? 0 : 1]);
        };
        scrub.oninput = function () {
          var sel = mod.ccall("gallery_selected", "number", [], []);
          var duration = mod.ccall("gallery_item_duration", "number", ["number"], [sel]);
          mod.ccall("gallery_set_time", null, ["number"], [(scrub.value / 1000) * duration]);
        };

        (function refresh() {
          var sel = mod.ccall("gallery_selected", "number", [], []);
          var duration = mod.ccall("gallery_item_duration", "number", ["number"], [sel]);
          var t = mod.ccall("gallery_time", "number", [], []);
          var playing = mod.ccall("gallery_playing", "number", [], []) !== 0;
          playBtn.innerText = playing ? "Pause" : "Play";
          if (playing) scrub.value = Math.round((t / duration) * 1000);
          timeLabel.innerText = t.toFixed(2) + " / " + duration.toFixed(2) + " s";
          requestAnimationFrame(refresh);
        })();
      }
    </script>
  </body>
</html>
