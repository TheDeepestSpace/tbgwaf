<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>tbgwaf</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #16171a;
        color: #e6e6e6;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 20;
        font-size: 12px;
        opacity: 0.8;
        text-align: right;
      }
      #status:empty { display: none; }
      #panes {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      .pane {
        position: relative;
        flex: 1 1 50%;
        min-width: 0;
      }
      .pane + .pane { border-left: 2px solid #000; }
      .pane canvas {
        background: #000;
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="panes">
      <div class="pane" id="pane-blue">
        <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
      <div class="pane" id="pane-red">
        <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
    </div>
    <div id="hud">
      <div>Blue plans in the left canvas, Red in the right; both plan at once.</div>
      <div id="status">Loading...</div>
    </div>
    <script src="tactics_app.js"></script>
    <script type="text/javascript">
      var statusEl = document.getElementById("status");
      window.onerror = function () {
        statusEl.innerText = "Failed to load -- check the browser console.";
      };
      // Both teams play on this one page: the module is instantiated twice,
      // one client per team, each rendering into its own canvas. The two
      // instances keep one shared match by exchanging state over this bus
      // (a list of per-instance inboxes): Blue simulates rounds, Red sends
      // its plans/commit requests to Blue and mirrors Blue's snapshots.
      var bus = { inboxes: [] };
      // The factory promise only settles when main() exits, which an
      // infinite main loop never does -- so readiness is tracked via
      // onRuntimeInitialized instead.
      var pending = 2;
      function spawnClient(player) {
        var pane = document.getElementById("pane-" + player);
        createTbgwafModule({
          canvas: pane.querySelector("canvas"),
          tbgwafPlayer: player,
          tbgwafBus: bus,
          onRuntimeInitialized: function () {
            if (--pending === 0) statusEl.innerText = "";
          },
        });
      }
      spawnClient("blue");
      spawnClient("red");
    </script>
  </body>
</html>
