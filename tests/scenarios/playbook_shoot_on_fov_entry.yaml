name: playbook_shoot_on_fov_entry
description: >
  Standing playbook rule "shoot" (reaction_on_stationary: shoot): blue0 passes (stays
  stationary) while red1 walks out from behind a wall into blue0's view. The moment red1
  enters blue0's FOV+LOS blue0 fires on its own, so red1 drops short of its destination.
  Counterpart: playbook_do_nothing_lets_enemy_pass. Mirrors
  TestGameLogicPlaybookShootsOnFovEntryAndPersistsAcrossRounds. A tall wall sits between
  blue0 and red1's start; red1 starts hidden behind it and walks out past its end into view.
  Red2 stays back to keep red alive so the game isn't over (the round would stay 1 on a
  win).

map:
  obstacles:
    - {center: [-3, 0], half_extent: [0.3, 2], height: 3}

units:
  - {id: 0, team: blue, position: [-8, 0, 0], facing_degrees: 0, reaction_on_stationary: shoot}
  - {id: 1, team: red, position: [-1, 0, 0], facing_degrees: 90}
  - {id: 2, team: red, position: [9, 0, 9], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: false}
  - action: pass
    actor: 0
  - action: move
    actor: 1
    destination: [-1, 0, 5]
  - action: pass
    actor: 2
  - action: commit
  - assert: {unit: 0, alive: true}
  - assert: {unit: 1, alive: false}
  - assert: {round: 2}
