name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check flow/app_flow.mmd is in sync with flow/app_flow.yaml
        run: |
          python3 -m pip install --quiet jinja2 pyyaml
          python3 scripts/gen_flow.py flow/app_flow.yaml \
            --header "$RUNNER_TEMP/AppFlow.h" --mermaid "$RUNNER_TEMP/app_flow.mmd" \
            --templates flow/templates
          diff -u flow/app_flow.mmd "$RUNNER_TEMP/app_flow.mmd" || {
            echo "::error::flow/app_flow.mmd is stale; regenerate with scripts/gen_flow.py"
            exit 1
          }

      - name: Install toolchain and headless GLES3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config python3-jinja2 python3-yaml \
            libsdl2-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dev mesa-common-dev \
            xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Server-only build: proves the SDL2/EGL/GLESv2 dev packages aren't
      # needed for the headless targets (runs from a scratch build dir).
      - name: Headless/server-only build and test
        run: |
          cmake -B build-headless -G Ninja -DCMAKE_BUILD_TYPE=Release -DTBGWAF_BUILD_CLIENT=OFF
          cmake --build build-headless
          ctest --test-dir build-headless --output-on-failure

      - name: Upload visual test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual_out
          path: |
            build/visual_out
            build/map_visual_out
