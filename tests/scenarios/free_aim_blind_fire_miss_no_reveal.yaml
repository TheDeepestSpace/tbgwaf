name: free_aim_blind_fire_miss_no_reveal
description: >
  Issue #129 blind fire, the miss half: same crouch-height-cover layout as
  free_aim_blind_fire_hit_reveals, but the pinned roll misses. A blind shot that doesn't
  connect reveals nothing -- no kill, no sighting memory, no live visibility -- even
  though the figure still turned and took the shot.

shot_rolls: [0.99]

map:
  obstacles:
    - {center: [2.5, 0], half_extent: [0.5, 2], height: 0.8}

units:
  - {id: 0, team: blue, position: [-6, 0, 0], facing_degrees: -90}
  - {id: 1, team: red, position: [6, 0, 0], facing_degrees: 180}
  - {id: 2, team: red, position: [-2, 0, 2.5], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: false}
  - assert: {unit: 2, visible_to: blue, visible: false, comment: Off to blue's side before the turn}

  - action: shoot
    actor: 0
    at: [6, 0.9, 0]
  - action: pass
    actor: 1
  - action: pass
    actor: 2
  - action: commit

  - assert: {unit: 1, alive: true, comment: The 0.99 roll missed}
  - assert: {unit: 0, facing_degrees: 0, tolerance: 1.0, comment: The shot was still taken}
  - assert: {unit: 1, remembered_by: blue, remembered: false, comment: A miss leaks nothing}
  - assert: {unit: 1, visible_to: blue, visible: false}
  - assert: {unit: 2, visible_to: blue, visible: true, comment: The FOV follows the kept facing}
  - assert: {round: 2}
