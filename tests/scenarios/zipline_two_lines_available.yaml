name: zipline_two_lines_available
description: >
  Issue #166: two lines are within reach of the same spot. Each Blue figure's
  destination is only reachable via one of them (budget 20; walking is 38+),
  so the planner picks the right line per figure, and since they ride
  different lines nobody waits.

map:
  half_extent: 40
  ziplines:
    - {from: [-16, 0, 0], to: [10, 0, 0]}
    - {from: [-18, 0, 4], to: [-18, 0, 30]}

units:
  - {id: 0, team: blue, position: [-18, 0, 2], facing_degrees: 0}
  - {id: 1, team: blue, position: [-20, 0, 2], facing_degrees: 0}
  - {id: 2, team: red, position: [30, 0, -30], facing_degrees: 180}

script:
  - action: move
    actor: 0
    destination: [18, 0, 0]
    comment: East line; walk 2.8 + ride 6.5 + walk 8.
  - action: move
    actor: 1
    destination: [-18, 0, 38]
    comment: North line; walk 2.8 + ride 6.5 + walk 8.
  - action: pass
    actor: 2
  - action: commit
  - assert: {unit: 0, position: [18, 0, 0], tolerance: 0.05}
  - assert: {unit: 1, position: [-18, 0, 38], tolerance: 0.05}
  - assert: {round: 2}
