# The shot cone has a hard range cap (constants::kShootRange = 60). A target
# that is visible (sighting range is longer) but beyond the cap can be
# planned against, yet the shot never fires: no roll is made, the target
# survives, and the shooter never plays the draw animation.
name: shot_beyond_range_never_fires

# The default map is 30x30, so grow it (half_extent 50) to fit both figures
# (80 units apart), and zoom out so both are in frame in the goldens.
map:
  half_extent: 50

camera:
  target: [0, 0]
  zoom: 150

units:
  - {id: 0, team: blue, position: [-40, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [40, 0, 0], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: true}

  - action: shoot
    actor: 0
    target: 1
  - action: pass
    actor: 1
  - action: commit
  # 80 units apart: out of range, so the held shot stays unfired.
  - assert: {unit: 1, alive: true}
  - assert: {unit: 0, alive: true}
