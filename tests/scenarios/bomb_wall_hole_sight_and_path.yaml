name: bomb_wall_hole_sight_and_path
description: >
  Destruction I (issue #350): the debug bomb blows a hole through the wall
  between the squads. Before the blast neither side sees the other and the
  wall (spanning the whole map) cannot be crossed; once the bomb has gone off during a round, the next turn the red figure
  shows through the breach (sight and shots pass), and because the hole
  reaches the floor with headroom blue walks through it to the far side.
  The goldens show the holed wall from both panes.

camera:
  target: [0, 0]
  zoom: 22

map:
  half_extent: 8
  obstacles:
    - {center: [0, 0], half_extent: [0.15, 8], height: 3}

units:
  - {id: 0, team: blue, position: [-4, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [4, 0, 0], facing_degrees: 180}

script:
  - assert: {unit: 1, visible_to: blue, visible: false}
  - action: move
    actor: 0
    destination: [4.8, 0, 0]
    expect_unreachable: true
    comment: The wall spans the whole map; there is no way around or through yet.
  - action: bomb
    position: [0, 1, 0]
    radius: 3
    at: 1.0
    comment: Debug bomb at the foot of the wall, armed to go off 1s into the round.
  - action: pass
    actor: 0
  - action: pass
    actor: 1
  - action: commit
    comment: The blast plays out during this round (captured frame by frame).
  - assert: {round: 2}
  - assert: {unit: 1, visible_to: blue, visible: true}
  - action: move
    actor: 0
    destination: [3.0, 0, -1.0]
    comment: Next turn, through the floor-reaching breach (past the rubble) to the red side.
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [3.0, 0, -1.0], tolerance: 0.3}
  - assert: {round: 3}
