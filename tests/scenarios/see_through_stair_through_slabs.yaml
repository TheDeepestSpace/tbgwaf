name: see_through_stair_through_slabs
description: >
  PR #313 review: the stair outline shows through the floor slabs of a
  camera-faded building. Same building and occupants as
  see_through_building_outlines_upper_floor, but viewed side-on from a
  rotated, lowered, closer camera (the first scenario to use the runner's
  camera yaw/pitch), so the flights cross behind the slabs on screen. The
  goldens pin: the covered stair parts are inked dim -- only what would be
  visible were the slabs absent (anything else occluding the stair still
  wins) -- while the parts in plain view keep their full ink, and the slab
  edges crossing in front of the stair stay inked.

map:
  generate: {seed: 7, type: urban, elevated: false, features: {terrain: off}}

units:
  - {id: 0, team: blue, position: [-29.11, 4, -8.25], facing_degrees: 0}
  - {id: 1, team: red, position: [40, 0, -30], facing_degrees: 180}
  - {id: 2, team: blue, position: [-35.6, 0, -2.1], facing_degrees: 0}

camera:
  target: [-31.9, -6.7]
  zoom: -150
  yaw_degrees: 120
  pitch_degrees: -15

render:
  npr: true

script:
  - assert: {round: 1}
  - assert: {unit: 0, position: [-29.11, 4, -8.25], tolerance: 0.1}
