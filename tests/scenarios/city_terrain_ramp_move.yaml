# The blue figure climbs a stair flight attached along a terrain level's
# retaining wall (issue #155) and turns onto the level over the wall top.
# This also pins terrain-following pavement and the shadow-map FOV receivers.
name: city_terrain_ramp_move
map:
  generate:
    type: urban
    seed: 7
    elevated: false
    features: {terrain: on}
    terrain_levels: -1
units:
  - {id: 0, team: blue, position: [-39.2, 0, -51.26], facing_degrees: 100}
  - {id: 1, team: red, position: [-65, 0, 10], facing_degrees: 0}
camera:
  target: [-39.5, -47.5]
  zoom: -120
render: {fov_overlay: shadow_map}
script:
  - assert: {unit: 0, position: [-39.2, 0.10, -51.26], tolerance: 0.05}
  - action: move
    actor: 0
    destination: [-40.12, 4.681, -43.87]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-40.12, 4.681, -43.87], tolerance: 0.05}
  - assert: {round: 2}
