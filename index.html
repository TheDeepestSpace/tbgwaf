<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>tbgwaf · Jev preview</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        background: #16171a;
        color: #e6e6e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #control-panel {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: min(760px, calc(100vw - 24px));
        padding: 9px 12px;
        border: 1px solid #4b4e56;
        border-radius: 8px;
        background: rgba(20, 21, 24, 0.94);
        box-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
        font-size: 12px;
      }
      .row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .row + .row { margin-top: 7px; }
      button, input {
        border: 1px solid #5b5f69;
        border-radius: 4px;
        background: #292b31;
        color: inherit;
        padding: 5px 8px;
        font: inherit;
      }
      button { cursor: pointer; }
      button:hover { background: #363941; }
      button[aria-pressed="true"] { border-color: #7ba7ff; background: #253858; }
      button:disabled { cursor: default; opacity: 0.45; }
      #mode-label { font-weight: 650; cursor: grab; touch-action: none; user-select: none; }
      #control-panel.dragging #mode-label { cursor: grabbing; }
      #ai-status[data-kind="error"] { color: #ff9d9d; }
      #ai-status[data-kind="fallback"] { color: #ffd778; }
      #outcome { color: #a9d4ff; }
      #config { margin-left: auto; }
      #config summary { cursor: pointer; color: #b9bbc2; }
      #jev-endpoint { width: min(310px, 55vw); }
      #hud {
        position: fixed;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        z-index: 20;
        font-size: 12px;
        opacity: 0.82;
        text-align: right;
        pointer-events: none;
      }
      #status:empty { display: none; }
      /* 100vh on iOS includes the area under the dynamic toolbar; use dvh
         (100vh is only the fallback) and keep the canvases (which carry the
         bottom-anchored timeline) clear of the home indicator. */
      #panes {
        display: flex; box-sizing: border-box;
        width: 100%; max-width: 100vw;
        height: 100vh; height: 100dvh;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .pane { position: relative; flex: 1 1 50%; min-width: 0; }
      .pane + .pane { border-left: 2px solid #000; }
      .pane canvas { background: #000; display: block; width: 100%; height: 100%; }
      /* Jev vs Jev: one omniscient Blue-instance pane; the Red instance keeps
         running (hidden, same size) so its AI and simulation mirror still work. */
      #panes[data-spectator="true"] #pane-red {
        position: absolute; inset: 0; visibility: hidden; pointer-events: none;
      }
      #panes[data-spectator="true"] .pane + .pane { border-left: 0; }
      /* Jev vs Jev on a server: a third, read-only client (unfiltered view of both
         teams) is the visible pane; the Blue and Red Jev clients run hidden. */
      #panes[data-spectator-pane="true"] #pane-blue {
        position: absolute; inset: 0; visibility: hidden; pointer-events: none;
      }
      @media (max-width: 680px) {
        #control-panel { left: 6px; right: 6px; transform: none; width: auto; }
        #config { margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <main id="panes">
      <div class="pane" id="pane-blue" aria-label="Blue team view (Jev vs Jev: spectator view of all figures)">
        <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
      <div class="pane" id="pane-red" aria-label="Red team view">
        <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
      <div class="pane" id="pane-spectator" aria-label="Spectator view of both teams" hidden>
        <canvas oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      </div>
    </main>

    <section id="control-panel" aria-label="Preview mode controls">
      <div class="row">
        <span id="mode-label">Mode: Human vs Human</span>
        <button type="button" data-mode="human" aria-pressed="true">Human vs Human</button>
        <button type="button" data-mode="player-v-ai" aria-pressed="false">Blue vs Jev</button>
        <button type="button" data-mode="ai-v-ai" aria-pressed="false">Jev vs Jev</button>
        <button id="open-online" type="button" hidden>Online (2 players)</button>
        <details id="config">
          <summary>Jev proxy</summary>
          <div class="row">
            <input id="jev-endpoint" type="url" inputmode="url"
                   aria-label="Jev proxy URL" placeholder="http://localhost:8787" />
            <button id="save-endpoint" type="button">Use endpoint</button>
          </div>
        </details>
      </div>
      <div class="row">
        <button id="start-ai" type="button" disabled>Start</button>
        <button id="pause-ai" type="button" disabled>Pause</button>
        <button id="restart-match" type="button">Restart</button>
        <button id="retry-ai" type="button" hidden>Retry Jev</button>
        <button id="fallback-ai" type="button" hidden>Use deterministic fallback</button>
        <span id="ai-status" role="status" aria-live="polite">Human-controlled match.</span>
        <span id="outcome"></span>
      </div>
    </section>

    <div id="hud">
      <div>Blue uses the left canvas; Red uses the right (Jev vs Jev: one spectator view of both teams). Camera orbit and zoom stay available.</div>
      <div id="status">Loading game…</div>
    </div>
    <script>
      // Drag the control panel by its "Mode:" label; position persists in
      // localStorage. Double-click the label to reset. UI-only: no game input.
      (() => {
        const panel = document.getElementById("control-panel");
        const handle = document.getElementById("mode-label");
        const KEY = "tbgwaf.controlPanelPos";
        const clamp = (x, y) => {
          const r = panel.getBoundingClientRect();
          return [
            Math.min(Math.max(0, x), Math.max(0, innerWidth - r.width)),
            Math.min(Math.max(0, y), Math.max(0, innerHeight - r.height)),
          ];
        };
        const place = (x, y) => {
          [x, y] = clamp(x, y);
          Object.assign(panel.style, {
            left: x + "px", top: y + "px", right: "auto", transform: "none",
          });
          return [x, y];
        };
        const reset = () => {
          for (const p of ["left", "top", "right", "transform"]) panel.style[p] = "";
          try { localStorage.removeItem(KEY); } catch {}
        };
        const save = (x, y) => {
          try { localStorage.setItem(KEY, JSON.stringify([x, y])); } catch {}
        };
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(KEY)); } catch {}
        const offscreen = (x, y) => {
          const r = panel.getBoundingClientRect();
          return x > innerWidth - 40 || y > innerHeight - 20 || x + r.width < 40 || y < 0;
        };
        const restore = () => {
          if (!Array.isArray(saved) || !saved.every(Number.isFinite)) return;
          place(saved[0], saved[1]);
          const r = panel.getBoundingClientRect();
          if (offscreen(r.left, r.top)) { reset(); saved = null; }
        };
        restore();
        addEventListener("resize", () => {
          if (!panel.style.left) return;
          const r = panel.getBoundingClientRect();
          if (offscreen(r.left, r.top)) { reset(); return; }
          const [x, y] = place(r.left, r.top);
          save(x, y);
          saved = [x, y];
        });
        let drag = null;
        handle.addEventListener("pointerdown", (e) => {
          if (e.button > 0) return;
          const r = panel.getBoundingClientRect();
          drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top };
          handle.setPointerCapture(e.pointerId);
          panel.classList.add("dragging");
          e.preventDefault();
        });
        handle.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          place(e.clientX - drag.dx, e.clientY - drag.dy);
        });
        const end = (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          drag = null;
          panel.classList.remove("dragging");
          const r = panel.getBoundingClientRect();
          if (panel.style.left) { saved = [r.left, r.top]; save(r.left, r.top); }
        };
        handle.addEventListener("pointerup", end);
        handle.addEventListener("pointercancel", end);
        handle.addEventListener("dblclick", () => { reset(); saved = null; });
      })();
    </script>
    <script src="tactics_app.js"></script>
    <script type="text/javascript">
      // Two ways to play:
      //  * Server mode: both panes are separate clients of the authoritative
      //    server over WebSockets (?solo=1: one pane, for two browsers). The URL comes from ?server=ws://host:port (a bare
      //    port such as ?server=8080 means ws://localhost:8080), else from
      //    the build-time default (cmake -DTBGWAF_SERVER_URL=...). ?room=NAME
      //    picks which room to pair in (default: private to this page load
      //    in split screen). ?online=1 (or ?solo=1) is the single-pane game
      //    whose own menu (Game Mode -> Online) has the new-room / join-by-code
      //    screen; with ?room=NAME it connects straight to that room.
      //  * Local preview (no server): both teams on this page, with the Jev
      //    controls, driven by jev-preview.js. Used when no server is
      //    configured, or forced with ?local=1.
      var BUILD_DEFAULT_SERVER = "wss://tbgwaf-server.fly.dev"; // Left as-is when served from source.
      function resolveServerUrl() {
        var params = new URLSearchParams(window.location.search);
        if (params.has("local")) return "";
        var url = params.get("server");
        if (url === null) url = BUILD_DEFAULT_SERVER.charAt(0) === "@" ? "" : BUILD_DEFAULT_SERVER;
        url = url.trim();
        if (/^\d+$/.test(url)) url = "ws://localhost:" + url;
        return url;
      }
      var serverUrl = resolveServerUrl();
      var statusEl = document.getElementById("status");
      var params = new URLSearchParams(window.location.search);
      function pageUrl(changes) {
        var url = new URL(window.location.href);
        ["online", "solo", "room", "intent"].forEach(function (k) { url.searchParams.delete(k); });
        Object.keys(changes).forEach(function (k) { url.searchParams.set(k, changes[k]); });
        return url.toString();
      }
      if (serverUrl && (params.has("online") || params.has("solo"))) {
        // One canvas, one player. Without ?room= the game's own menu
        // (New Game -> Online) creates or joins a room; ?room=NAME connects
        // straight away (a second player opens the same URL).
        document.getElementById("pane-red").remove();
        document.getElementById("control-panel").remove();
        statusEl.innerText = "Online match via " + serverUrl;
        window.onerror = function () {
          statusEl.innerText = "Failed to load -- check the browser console.";
        };
        createTbgwafModule({
          canvas: document.querySelector("#pane-blue canvas"),
          tbgwafServer: serverUrl,
          tbgwafRoom: params.get("room") || "",
          tbgwafRoomIntent: params.get("intent") || "",
          tbgwafAutoEnter: params.has("intent"),  // Straight to the match: it shows the room code.
          onRuntimeInitialized: function () { statusEl.innerText = ""; },
        });
      } else {
        // Split screen: both panes are separate clients of the server, paired
        // through a room private to this page load (so the mode controls,
        // including the Jev modes, work as in the local preview).
        if (serverUrl) {
          // Online play is the single-pane game with its own Room menu.
          var openOnline = document.getElementById("open-online");
          openOnline.hidden = false;
          openOnline.addEventListener("click", function () {
            window.location.href = pageUrl({ online: "1" });
          });
          var room = params.get("room") ||
            "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
          window.TBGWAF_SERVER = { url: serverUrl, room: room };
        }
        import("./jev-preview.js");
      }
    </script>
  </body>
</html>
