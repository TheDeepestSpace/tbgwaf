# Issue #130: seed-driven overpass layouts. Nothing is forced: seed 33's
# default draw naturally yields the ramp-up-ramp-down layout (both artery ramps on-map).
# Blue climbs the branch's connecting ramp; the asserted Y proves the
# ramp-off works, and the goldens show the deck rising from grade at both map edges.
name: overpass_ramp_up_ramp_down

map:
  generate: {type: urban, seed: 33, arteries: 2}

units:
  - {id: 0, team: blue, position: [-33.1497, 0.529, 5.3773], facing_degrees: 0}
  - {id: 1, team: red, position: [-66.45, 0.025, 18.3239], facing_degrees: 180}

camera:
  target: [-27.6, 3.2]
  zoom: 34

script:
  - action: move
    actor: 0
    destination: [-22.0497, 2.4312, 1.0617]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-22.0497, 2.4312, 1.0617], tolerance: 0.05}
  - assert: {round: 2}
