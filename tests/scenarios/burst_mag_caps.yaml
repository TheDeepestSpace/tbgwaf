name: burst_mag_caps
description: >
  Multi-shot bursts (issue #138), each weapon at its cap: one shooting action may fire up
  to min(magazine, round window / fire interval) shots -- AR 30, sniper 5, Deagle 8. Since
  issue #140 the bursts are paced in real time (AR 0.16 s, sniper 1.0 s, Deagle 0.5 s
  between shots), so rolls are consumed in shot-schedule order across all three bursts at
  once. The pinned rolls make every shot miss except the very last one of each burst, so
  each red figure only drops if its attacker fired *exactly* its weapon's cap on exactly
  its weapon's schedule: any missing shot or timing drift pulls the hit rolls out of
  alignment.

units:
  - {id: 0, team: blue, position: [-8, 0, -4], facing_degrees: 0}  # Assault rifle, cap 30.
  - {id: 1, team: blue, position: [-8, 0, 0], facing_degrees: 0}   # Sniper rifle, cap 5.
  - {id: 2, team: blue, position: [-8, 0, 4], facing_degrees: 0}   # Desert Eagle, cap 8.
  - {id: 3, team: red, position: [8, 0, -4], facing_degrees: 180}
  - {id: 4, team: red, position: [8, 0, 0], facing_degrees: 180}
  - {id: 5, team: red, position: [8, 0, 4], facing_degrees: 180}

# Consumed in shot-schedule order (time, then unit order on ties): the three
# bursts interleave, with hits landing on the Deagle's 8th shot (t=3.5, roll
# 34), the sniper's 5th (t=4.0, roll 39) and the AR's 30th (t=4.64, roll 43).
shot_rolls: [0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9,
             0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9, 0.9,
             0.9, 0.9, 0.9, 0.05, 0.9, 0.9, 0.9, 0.9, 0.05, 0.9, 0.9, 0.9, 0.05]

script:
  - action: shoot
    description: Every blue figure empties a full burst at its opposite number; only the last shot of each burst is a pinned hit.
    actor: 0
    target: 3
    shots: 30
  - action: shoot
    actor: 1
    target: 4
    shots: 5
  - action: shoot
    actor: 2
    target: 5
    shots: 8
  - action: pass
    actor: 3
  - action: pass
    actor: 4
  - action: pass
    actor: 5
  - action: commit

  - assert: {unit: 3, alive: false, comment: Dropped by the AR burst's 30th shot}
  - assert: {unit: 4, alive: false, comment: Dropped by the sniper burst's 5th shot}
  - assert: {unit: 5, alive: false, comment: Dropped by the Deagle burst's 8th shot}
  - assert: {winner: blue}
