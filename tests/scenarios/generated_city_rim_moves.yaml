# Seeded procedural city (seed 2024): both squads advance along their rim
# streets within one round's move budget (planned on a range-scoped navmesh
# windowed around each figure), framed on the west half of the city.
name: generated_city_rim_moves

map:
  generate: {seed: 2024}

camera: {target: [-40, 0], zoom: 40}

script:
  - action: move
    actor: 0
    destination: [-64, 0, -20]
  - action: move
    actor: 2
    destination: [-64, 0, 20]
  - action: pass
    actor: 1
  - action: pass
    actor: 3
  - action: pass
    actor: 4
  - action: pass
    actor: 5
  - action: commit
  - assert: {unit: 0, position: [-64, 0, -20], tolerance: 0.05}
  - assert: {unit: 2, position: [-64, 0, 20], tolerance: 0.05}
  - assert: {round: 2}
