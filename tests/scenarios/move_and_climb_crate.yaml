name: move_and_climb_crate
description: >
  Regression coverage for climbing a crate over its ramp (issue #40), matching
  TestGameLogicMoveCanClimbOntoObstacle in tests/logic_tests.cpp: a move destination on top
  of a crate should route up its ramp onto the top surface rather than being rejected as
  unreachable.
  Both figures act in the same WEGO round: blue0 climbs while red1 crosses the open ground
  concurrently.

map:
  obstacles:
    - {center: [0, 0], half_extent: [0.6, 0.6], height: 1.2, ramp: "-x"}

units:
  - {id: 0, team: blue, position: [-5, 0, 0], facing_degrees: 0}
  - {id: 1, team: red, position: [5, 0, 0], facing_degrees: 180}

script:
  - action: move
    actor: 0
    destination: [0, 1.2, 0]
    comment: The crate's top surface
  - action: move
    actor: 1
    destination: [5, 0, -5]
  - action: commit
  - assert: {unit: 0, position: [0, 1.2, 0], tolerance: 0.05}
  - assert: {unit: 1, position: [5, 0, -5], tolerance: 0.05}
  - assert: {round: 2}
