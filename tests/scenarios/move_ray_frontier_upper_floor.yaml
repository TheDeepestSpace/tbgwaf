name: move_ray_frontier_upper_floor
description: >
  Frontier-aware move selection when the frontier itself spans storeys: from
  the same ground-floor start as move_ray_skips_unreachable_floors, the one-
  leg frontier climbs the stair and includes first-floor cells by the stair
  top (cells whose ground below is walled off, so the field prices the y = 4
  layer there). A straight-down ray over such a cell crosses the second-floor
  slab first; that slab is out of this leg's reach, so the selector falls
  through it and lands on the first-floor layer the frontier shows, and the
  committed move climbs the stair to y = 4 -- not the storey above, and not
  the ground floor below.

map:
  generate: {seed: 7, type: urban, elevated: false, features: {terrain: off}}

units:
  - {id: 0, team: blue, position: [-31.9, 0, -6.7], facing_degrees: 0}
  - {id: 1, team: red, position: [40, 0, -30], facing_degrees: 180}

camera:
  target: [-32.3, -8.1]
  zoom: -145

script:
  - action: move
    actor: 0
    ray_from: [-29, 60, -9]
    ray_dir: [0, -1, 0]
  - action: pass
    actor: 1
  - action: commit
  - assert: {unit: 0, position: [-29, 4, -9], tolerance: 0.1}
  - assert: {round: 2}
