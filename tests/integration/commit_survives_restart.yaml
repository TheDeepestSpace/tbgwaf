name: commit_survives_restart
description: >
  Both players commit; the server is hard-killed (SIGKILL) right after one commit, before the
  other. The commit is on disk: after a restart the committed side is still committed and only
  the other player's commit resolves the round. Also a plain client kill (no server restart).
steps:
  - server: start
  - app: [alice, bob]
  - click: {app: alice, button: New Game}
  - click: {app: alice, button: Regular}
  - click: {app: alice, button: Urban}
  - click: {app: alice, button: Online (2 players)}
  - click: {app: alice, button: New room}
  - click: {app: bob, button: New Game}
  - click: {app: bob, button: Regular}
  - click: {app: bob, button: Urban}
  - click: {app: bob, button: Online (2 players)}
  - type_room_code: {app: bob, from: alice}
  - click: {app: bob, button: Join}
  - round: {apps: [alice, bob]}
  - commit: bob
  - server: crash
  - reload: alice
  - reload: bob
  - click: {app: bob, button: Continue}
  - assert: {app: bob, screen: gameplay, status: playing, round: 2, self_ready: true, peer_ready: false}
  - click: {app: alice, button: Continue}
  - assert: {app: alice, round: 2, self_ready: false, peer_ready: true}
  - commit: alice
  - assert: {app: alice, round: 3}
  - assert: {app: bob, round: 3}
  # A killed client (server stays up): the opponent is told, the seat is held, the round waits.
  - snapshot: {app: alice, name: alice_round3}
  - reload: alice
  - assert: {app: bob, peer_away: true}
  - commit: bob
  - assert: {app: bob, round: 3, self_ready: true}
  - click: {app: alice, button: Continue}
  - assert: {app: alice, round: 3, peer_ready: true}
  - commit: alice
  - assert: {app: alice, round: 4}
  - assert: {app: bob, round: 4, peer_away: false}
