name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-ci:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check flow/app_flow.mmd is in sync with flow/app_flow.yaml
        run: |
          python3 scripts/gen_flow.py flow/app_flow.yaml \
            --header "$RUNNER_TEMP/AppFlow.h" --mermaid "$RUNNER_TEMP/app_flow.mmd" \
            --templates flow/templates
          diff -u flow/app_flow.mmd "$RUNNER_TEMP/app_flow.mmd" || {
            echo "::error::flow/app_flow.mmd is stale; regenerate with scripts/gen_flow.py"
            exit 1
          }

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload visual test output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual_out
          path: build/visual_out
