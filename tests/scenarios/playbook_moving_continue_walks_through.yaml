# Moving + continue: red1 walks toward a watcher that sees it; the playbook doesn't interrupt, so it finishes the walk and nobody shoots.
# Mirrors TestGameLogicPlaybookMovingRows / TestGameLogicPlaybookEveryCheckbox.
name: playbook_moving_continue_walks_through

camera:
  target: [8, 3]
  zoom: 4

playbook:
  red: {moving_seen: continue, moving_unseen: continue}

units:
  # Watcher, faces the lane (-Z) so it sees red1 and red1 sees it back.
  - {id: 0, team: blue, position: [8, 0, 6], facing_degrees: -90}
  # Keeps blue alive when red shoots, so the game isn't over.
  - {id: 1, team: blue, position: [-9, 0, 9], facing_degrees: 0}
  # Walks +Z toward the watcher.
  - {id: 2, team: red, position: [8, 0, 0], facing_degrees: 90}
  - {id: 3, team: red, position: [9, 0, -9], facing_degrees: 0}

script:
  - action: pass
    actor: 0
  - action: pass
    actor: 1
  - action: move
    actor: 2
    destination: [8, 0, 3]
  - action: pass
    actor: 3
  - action: commit
  - assert: {unit: 2, position: [8, 0, 3], tolerance: 0.1}
  - assert: {unit: 0, alive: true}
  - assert: {round: 2}
