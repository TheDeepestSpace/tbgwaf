# Default playbook rule (do_nothing): identical layout to
# playbook_shoot_on_fov_entry, but blue0 has no standing reaction, so red1
# walks through its lane unharmed and reaches its destination.
name: playbook_do_nothing_lets_enemy_pass

map:
  obstacles: []

units:
  - {id: 0, team: blue, position: [-8, 0, 0], facing_degrees: 0, reaction_on_stationary: do_nothing}
  - {id: 1, team: red, position: [-9.5, 0, 0], facing_degrees: 0}

script:
  - action: pass
    actor: 0
  - action: move
    actor: 1
    destination: [0, 0, 0]
  - action: commit
  - assert: {unit: 0, alive: true}
  - assert: {unit: 1, alive: true}
  - assert: {unit: 1, position: [0, 0, 0], tolerance: 0.05}
  - assert: {round: 2}
