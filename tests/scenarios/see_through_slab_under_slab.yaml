name: see_through_slab_under_slab
description: >
  PR #313 review: a floor slab underneath another slab keeps a dim outline
  through the slab(s) covering it, like the covered stair parts. Same
  building and occupants as see_through_building_outlines_upper_floor,
  orbited a quarter turn and tilted a little steeper so the upper storey's
  slab covers the lower slabs' far edges on screen with clear parallax.
  The goldens pin: each covered slab edge draws as a dim line offset from
  the full-strength edge of the slab in front of it -- only what would be
  visible were the covering slabs absent (the opaque scene still wins the
  depth test) -- while slab edges in plain view keep their full ink and
  internal seams between a storey's floor patches stay un-inked.

map:
  generate: {seed: 7, type: urban, elevated: false, features: {terrain: off}}

units:
  - {id: 0, team: blue, position: [-29.11, 4, -8.25], facing_degrees: 0}
  - {id: 1, team: red, position: [40, 0, -30], facing_degrees: 180}
  - {id: 2, team: blue, position: [-35.6, 0, -2.1], facing_degrees: 0}

camera:
  target: [-31.9, -6.7]
  zoom: -150
  yaw_degrees: 90
  pitch_degrees: 10

render:
  npr: true

script:
  - assert: {round: 1}
  - assert: {unit: 0, position: [-29.11, 4, -8.25], tolerance: 0.1}
