name: Performance suite

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Repository ref to measure (branch, tag, or SHA)
        required: true
        default: master

permissions:
  contents: write
  packages: read

# Publishing serially keeps every observation in the gh-pages history.
concurrency:
  group: performance-suite-pages
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/thedeepestspace/tbgwaf-ci:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure Release build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build performance runner
        run: cmake --build build --target tactics_performance_suite

      - name: Measure pinned maps
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
          TARGET_REF: ${{ inputs.ref || 'master' }}
        run: |
          commit=$(git rev-parse HEAD)
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p performance-output
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' \
            build/tactics_performance_suite \
              --seeds tests/performance/seeds.txt \
              --output performance-output/results.json \
              --warmup-frames 30 \
              --sample-frames 120 \
              --commit "$commit" \
              --target-ref "$TARGET_REF" \
              --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --timestamp "$timestamp"

      - name: Upload raw measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-output/results.json
          retention-days: 90

      - name: Checkout published site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: performance-pages

      - name: Publish report and preserve run history
        run: |
          mkdir -p performance-pages/performance/history performance-pages/performance/latest
          history="performance-pages/performance/history/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cp performance-output/results.json "$history"
          cp performance-output/results.json performance-pages/performance/latest/results.json
          python3 scripts/generate_performance_report.py \
            --current performance-output/results.json \
            --history-dir performance-pages/performance/history \
            --out performance-pages/performance
          cd performance-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add performance
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Performance baseline ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin gh-pages
          git rebase origin/gh-pages
          git push origin HEAD:gh-pages
